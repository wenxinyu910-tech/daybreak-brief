  voices:[
    {id:"v1",cat:"leadership",conf:"fact",time:"2026-08-03 · 财报电话会 / CNBC",
     src:[{n:"Fortune",u:"https://fortune.com/2026/08/03/palantir-ceo-alex-karp-celebrates-93-revenue-growth-as-stock-soars-after-blockbuster-earnings-for-the-first-time-people-believe-us/"},{n:"TechCrunch",u:"https://techcrunch.com/2026/08/03/after-killer-quarter-palantir-ceo-alex-karp-calls-ai-industry-marxist/"}],
     zh:{name:"Alex Karp",role:"Palantir 联合创始人兼首席执行官",plat:"Q2财报电话会 / CNBC访谈",
       view:"称本季“超乎寻常”（otherworldly），“忘掉一致预期”，并称据其所知没有同等规模的企业增长达到这一半；强调“这一次人们终于信我们了——如果你不信，可以信美国149%的增长”，并判断当前增速“看起来至少还能持续18个月”。同时重申对前沿实验室的批评：它们的态度是“认为自己有资格殖民你的企业”。",
       bg:"Palantir当季收入19.4亿美元、同比增92.8%，美国商业收入增149%，上调全年美国商业指引至超34.2亿美元。",
       note:"两句话要分开听。数字侧（149%、62.4亿剩余合同价值）是可核验的披露，可信度高；“至少18个月”是CEO对自家需求周期的判断，属于观点而非指引，不应当作前瞻性承诺使用。至于“殖民企业”的说法，本质是在为“应用层独立于模型层”的定位辩护——这正是Palantir与前沿实验室争夺企业预算的核心叙事战场。"},
     en:{name:"Alex Karp",role:"Co-founder and CEO, Palantir",plat:"Q2 earnings call / CNBC interview",
       view:"Called the quarter 'otherworldly' and told investors to 'forget consensus,' saying no business at Palantir's scale has grown even half as much; added that 'for the first time people believe us — and if you didn't believe us, you can believe 149% growth in the U.S.,' and judged the current pace 'looks like this is going to go on for at least another 18 months.' He also repeated his critique of frontier labs, characterizing their posture as believing 'they deserve to colonize your enterprise.'",
       bg:"Palantir posted $1.94B in quarterly revenue, up 92.8%, with US commercial up 149% and full-year US commercial guidance raised above $3.42B.",
       note:"Separate the two claims. The numbers — 149%, $6.24B remaining deal value — are verifiable disclosure and carry high confidence. 'At least another 18 months' is the CEO's read on his own demand cycle: opinion, not guidance, and it should not be treated as a forward-looking commitment. The 'colonize your enterprise' line is fundamentally a defense of application-layer independence from the model layer — the core narrative battleground in the fight for enterprise budget."}},
    {id:"v2",cat:"macro",conf:"fact",time:"2026-08-03 · 日本財務省声明",
     src:[{n:"The Japan Times",u:"https://www.japantimes.co.jp/business/2026/08/03/markets/japan-us-joint-yen-intervention/"},{n:"Fortune",u:"https://fortune.com/2026/08/03/yen-rises-amid-speculation-of-more-intervention-after-u-s-support/"}],
     zh:{name:"片山皋月（Satsuki Katayama）",role:"日本财务大臣",plat:"财务省正式声明 / 记者会",
       view:"确认财务省已与美国财政部协同买入日元，操作依据2025年9月《日美财长联合声明》，针对“近期日元的过度波动与无序走势”，并明确表示必要时会采取进一步行动。",
       bg:"日元此前跌至约164的四十年低点，日本已多次单边入场但效果有限；这是2011年以来首次获得美方协同。",
       note:"“协同”两个字是全部信息量所在。单边干预市场早已学会消化（消息面冲击后回归趋势），而美方参与改变了博弈的赔率结构——做空日元的一方现在要对赌两个央行/财政部而非一个。这解释了为何市场立即出现“是否还有第二轮”的定价，也解释了为何日元升幅超出单边干预的历史均值。"},
     en:{name:"Satsuki Katayama",role:"Finance Minister, Japan",plat:"Ministry of Finance statement / press remarks",
       view:"Confirmed the ministry bought yen in coordination with the US Treasury under the September 2025 Joint Statement of the Japanese and US Finance Ministers, targeting 'recent excessive volatility and disorderly movements' in the yen, and stated explicitly that further action would be taken if needed.",
       bg:"The yen had fallen to a roughly 164 four-decade low; Japan had intervened unilaterally several times with limited effect. This is the first coordinated US participation since 2011.",
       note:"The word 'coordinated' carries all the information. Markets long ago learned to digest unilateral intervention — a headline shock, then a return to trend. US participation changes the odds structure: anyone short yen is now betting against two treasuries rather than one. That explains both the immediate pricing of a possible second round and a yen move larger than the historical average for unilateral action."}},
    {id:"v3",cat:"markets",conf:"op",time:"2026-08-03 · 市场评论（Capital.com）",
     src:[{n:"TheStreet",u:"https://www.thestreet.com/stock-market-today/stock-market-today-aug-3-2026-dow-futures-climb-as-oil-slides-on-renewed-iran-talks"}],
     zh:{name:"Daniela Hathorn",role:"Capital.com 高级市场分析师",plat:"市场评论（经TheStreet引述）",
       view:"称周末交付了交易员期待的地缘缓和，美股期货指向高开；同时给出财报季进度：<b>标普500约300家公司已发布，约85%超预期，整体利润增速跑在47%以上</b>，为多年来最强的财报季之一。",
       bg:"她提到海湾盟友（含沙特）在推动外交而非对抗方面施加了较大压力。",
       note:"85%超预期与47%的利润增速是本轮估值扩张最实的支撑，值得单独记下来——它意味着当前指数新高并非纯粹靠倍数扩张。但要注意两点：一是超预期率高部分源于预期本身被下调过；二是47%的聚合增速高度集中在少数大型科技与AI相关公司，向中位数公司外推会高估景气广度。"},
     en:{name:"Daniela Hathorn",role:"Senior market analyst, Capital.com",plat:"Market commentary (quoted by TheStreet)",
       view:"Said the weekend delivered the de-escalation traders had hoped for, with US futures pointing to a green open, and provided an earnings-season scorecard: <b>with roughly 300 S&P 500 companies reported, about 85% have beaten estimates and aggregate profit growth is tracking above 47%</b>, on course for one of the strongest seasons in years.",
       bg:"She noted Gulf allies including Saudi Arabia pushed hard for diplomacy over confrontation.",
       note:"The 85% beat rate and 47% aggregate profit growth are the most concrete support under this valuation expansion and worth logging separately — they mean record index levels are not purely multiple expansion. Two caveats: high beat rates partly reflect estimates that were cut beforehand, and the 47% aggregate is heavily concentrated in a handful of mega-cap tech and AI names, so extrapolating to the median company overstates the breadth."}},
    {id:"v4",cat:"ai",conf:"op",time:"2026-08-03 · TheStreet / Stanford CS153（背景）",
     src:[{n:"TheStreet",u:"https://www.thestreet.com/investing/stocks/nvidia-ceo-huang-ai-worries-data-centers-artificial-intelligence-ai-power"}],
     zh:{name:"Jensen Huang（黄仁勋）",role:"NVIDIA 创始人兼首席执行官",plat:"斯坦福CS153课堂发言，经TheStreet报道整理",
       view:"过去一年他一直在回应芯片供给、出口规则与增长可持续性的问题；近期他把最担心的事指向与硅无关的领域——电力。他称计算的能源需求“很可能是我们现在的1000倍”。",
       bg:"高盛研究预计美国数据中心用电2025年31GW、2026年41GW、2027年66GW；PJM容量价格从每兆瓦日28.92美元跳至329.17美元，约63%涨幅归因于数据中心。",
       note:"这不是新观点，但值得放进今天的语境：当中国模型把推理价格打到百分之一时，“每token能耗”从工程细节变成了竞争变量。如果电力成为硬约束，那么真正的护城河将从“谁有最多GPU”转向“谁锁定了最便宜、最确定的电”——这会重新排序数据中心的选址逻辑与长期电力购买协议（PPA）的战略权重。"},
     en:{name:"Jensen Huang",role:"Founder and CEO, NVIDIA",plat:"Stanford CS153 class remarks, as reported by TheStreet",
       view:"After a year fielding questions on chip supply, export rules and growth durability, he has lately pointed his biggest worry at something unrelated to silicon: power. He said computing's energy needs are 'likely probably 1,000 times more than we currently have.'",
       bg:"Goldman Sachs Research projects US data-center power demand of 31GW in 2025, 41GW in 2026 and 66GW in 2027; PJM capacity prices jumped from $28.92 to $329.17 per megawatt-day, with roughly 63% of the increase attributed to data centers.",
       note:"Not a new view, but worth placing in today's context: when Chinese models cut inference pricing to 1%, energy per token moves from an engineering detail to a competitive variable. If power becomes the binding constraint, the moat shifts from 'who has the most GPUs' to 'who has locked in the cheapest, most certain electricity' — which reorders data-center siting logic and the strategic weight of long-term power purchase agreements."}}

{
  date:"2026-08-02",
  lastUpdated:"2026-08-02 06:00 PT",
  summary:{
    zh:`周末没有行情，但有两件更重要的事：<b>AI开始产出人类未曾证明的数学，而为AI买单的信用市场开始要价</b>。OpenAI公布内部Astra模型解决十个悬而未决的数学与理论计算机问题，全部附Lean 4机器可校验证书、代码开源，推算API成本约2,000美元——这是"模型产出可验证新知识"的第一份硬证据。另一头，<b>CoreWeave被迫把26亿美元杠杆贷款利差抬到基准上浮5.5个百分点并折价发行</b>（用于扩建Anthropic算力），彭博称本周至少四家AI相关借款人让步——一级杠杆贷款市场开始给"AI泡沫风险"标价，这比股票波动更值得盯。政策面出现真空：<b>白宫错过了8月1日EO 14409前沿AI框架的交付期限</b>，联邦公报、NIST/CISA、OSTP全无动静，实验室在"covered frontier model"定义不明下推迟发布节奏；同日<b>加州SB 942正式生效</b>，月活超100万的生成式AI提供方须嵌入C2PA来源标识、提供免费检测工具，违规每日每例5,000美元。地缘上霍尔木兹再度升级——一艘载卡塔尔LNG的运输船在过峡时被击中。市场数据仍停在7/31收盘（标普7,489.72），周一重开时要看长端收益率与AI信用利差。`,
    en:`No tape over the weekend, but two things that matter more: <b>AI started producing mathematics humans had not proved, and the credit market financing AI started charging for it</b>. OpenAI published ten solutions to open problems in mathematics and theoretical computer science produced by an internal version of its Astra model, each shipping with a machine-checkable Lean 4 certificate and open-sourced code, at an estimated API cost of about $2,000 — the first hard evidence of a model generating verifiable new knowledge. At the other end, <b>CoreWeave had to lift the spread on a $2.6B leveraged loan to 5.5 points over benchmark and price it at a discount</b> to fund Anthropic capacity, with Bloomberg counting at least four AI-linked borrowers sweetening terms this week. The primary leveraged-loan market is now pricing AI-bubble risk, which matters more than equity chop. Policy went quiet in the wrong way: <b>the White House missed the August 1 EO 14409 frontier-AI framework deadline</b> — no Federal Register notice, no NIST or CISA publication, no OSTP statement — leaving labs holding release timelines while "covered frontier model" stays undefined. The same day <b>California SB 942 became operative</b>, requiring generative-AI providers with 1M+ monthly California users to embed C2PA provenance and offer a free detection tool, at $5,000 per day per violation. Geopolitically, Hormuz escalated again: a carrier hauling Qatari LNG was struck in transit. Market data still reflects the 7/31 close (S&P 7,489.72); watch long yields and AI credit spreads when trading resumes Monday.`
  },
  top5:[
    {id:"t1",cat:"ai",conf:"fact",time:"2026-08-01 · OpenAI research release",
     src:[{n:"OpenAI",u:"https://openai.com/index/ten-advances-in-mathematics/"},{n:"GitHub (openai/ten-proofs)",u:"https://github.com/openai/ten-proofs"},{n:"The Next Web",u:"https://thenextweb.com/news/openai-astra-model-ten-math-proofs-non-sofic-groups"}],
     zh:{t:"OpenAI公布Astra解出十个未解数学难题，每项都附Lean 4机器可校验证书",
       what:"OpenAI发布十项由内部版Astra模型产出的数学与理论计算机科学新结果，含推翻Connes关于群冯诺依曼代数的刚性猜想、构造证明非索菲群（non-sofic group）存在、把高维球堆积渐近上界压到Cohn–Elkies阈值、二元与球面码界的指数级改进、permanent的n⁴/log n公式下界，以及解决Erdős第183号问题（多色Ramsey数的超指数下界）与Ehrhart体积猜想。全部结果附机器可校验的Lean 4证书并开源在GitHub，同时发布推理过程走查；人类只做了格式整理。按现行API价格推算，找到这些解的算力成本约<b>2,000美元</b>。",
       why:"这与'模型在基准上得高分'是两回事。形式化证书意味着结论可被独立机器验证，不依赖对模型的信任；成本低到四位数美元，意味着'用模型攻未解问题'从表演变成可批量复制的研究流程。对任何以专业判断为壁垒的知识工作，这是时间表被压缩的信号。",
       who:"数学与理论计算机科学界、形式化验证工具链（Lean/Mathlib）、以研究生产力为卖点的AI实验室、依赖专家稀缺性定价的专业服务业。",
       watch:"同行对十项结果的独立复核（尤其Connes猜想反例）、Astra何时公开发布、其他实验室是否跟进'附证书'的发布规范，以及形式化验证是否成为AI科学声明的事实门槛。"},
     en:{t:"OpenAI published ten solved open math problems from Astra, each with a machine-checkable Lean 4 certificate",
       what:"OpenAI released ten new results in mathematics and theoretical computer science produced by an internal version of its Astra model family. They include a claimed counterexample to Connes's rigidity conjecture on group von Neumann algebras, a construction establishing that non-sofic groups exist, improved asymptotic upper bounds for high-dimensional sphere packing down to the Cohn–Elkies threshold, exponentially stronger bounds for binary and spherical codes, an n⁴/log n formula lower bound for the permanent, and resolutions of Erdős problem 183 (a superexponential lower bound for multicolor Ramsey numbers) and Ehrhart's volume conjecture. Every result ships with a machine-checkable Lean 4 certificate open-sourced on GitHub, alongside a walkthrough of the model's reasoning; humans only assisted with formatting. At current API rates the compute cost of finding the solutions is estimated at roughly <b>$2,000</b>.",
       why:"This is a different thing from scoring well on a benchmark. Formal certificates mean the conclusions can be independently machine-verified without trusting the model, and a four-figure dollar cost turns 'point a model at an open problem' from a demo into a repeatable research workflow. For any knowledge work whose moat is expert judgment, this compresses the timeline.",
       who:"Mathematics and theoretical CS, the formal-verification toolchain (Lean/Mathlib), AI labs selling research productivity, and professional services priced on expert scarcity.",
       watch:"Independent peer review of all ten results (especially the Connes counterexample), when Astra ships publicly, whether other labs adopt certificate-attached releases, and whether formal verification becomes the de facto bar for AI scientific claims."}},
    {id:"t2",cat:"policy",conf:"fact",time:"2026-08-01 → 08-02 · US federal agencies",
     src:[{n:"Yahoo Finance",u:"https://finance.yahoo.com/technology/ai/articles/white-house-ai-framework-deadline-002011007.html"},{n:"Vorp Labs",u:"https://vorplabs.com/ai-regulatory-updates/frontier-model-review-framework"},{n:"Congress.gov CRS (IF13268)",u:"https://www.congress.gov/crs-product/IF13268"}],
     zh:{t:"白宫错过EO 14409的8月1日交付期限，前沿AI框架至今无文本",
       what:"行政令14409要求联邦机构在8月1日前交付三项成果：由NSA、CISA与NIST主导的保密能力基准流程；由财政部、NSA、CISA与NIST管理的前沿模型自愿披露框架；以及OPM的联邦网络安全人才扩编方案。截至8月1日，联邦公报无公告、NIST与CISA无发布、白宫科技政策办公室（OSTP）亦无声明。报道称前沿实验室因无法判断自身架构是否触发'covered frontier model'门槛，正在推迟或调整内部发布时间表。",
       stage:"已逾期——法定设计截止日已过，交付物未公开；跨部门审议仍在进行",
       who:"OpenAI、Anthropic、Google、Meta等前沿实验室；云厂商与企业采购合规团队；同时面对欧盟AI法案与加州SB 942的多法域运营方。",
       watch:"框架文本何时落地、'covered frontier model'的具体门槛如何定义、是否出现新的合规缓冲期，以及联邦真空是否让加州与欧盟的规则事实上成为全国标准。"},
     en:{t:"The White House missed the August 1 EO 14409 deadline; there is still no frontier-AI framework text",
       what:"Executive Order 14409 required federal agencies to deliver three things by August 1: a classified capability-benchmarking process led by NSA, CISA and NIST; a voluntary frontier-model disclosure framework administered by Treasury, NSA, CISA and NIST; and an OPM plan to expand the federal cyber workforce. As of August 1 there were no Federal Register notices, no NIST or CISA publications and no OSTP statement. Reporting says frontier labs are delaying or reshaping internal release timelines because they cannot tell whether their architectures cross the 'covered frontier model' threshold.",
       stage:"Lapsed — the statutory design deadline has passed with no public deliverable; interagency deliberation continues",
       who:"Frontier labs including OpenAI, Anthropic, Google and Meta; cloud and enterprise procurement compliance teams; anyone operating across the EU AI Act and California SB 942 at the same time.",
       watch:"When the framework text appears, how the 'covered frontier model' threshold is defined, whether a new compliance grace period emerges, and whether the federal vacuum lets California and Brussels set the de facto national standard."}},
    {id:"t3",cat:"markets",conf:"report",time:"2026-08-01 · leveraged loan market (ET)",
     src:[{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-01/loan-investors-are-pushing-back-as-fear-rises-credit-weekly"},{n:"AI Weekly",u:"https://aiweekly.co/node/8771"}],
     zh:{t:"AI债开始被要价：CoreWeave把26亿美元杠杆贷款利差抬到5.5个百分点并折价发行",
       what:"彭博报道，本周至少四家借款人——包括AI云厂商CoreWeave与网络安全公司Proofpoint——为吸引对AI相关债务趋于谨慎的投资者，被迫改善贷款条款。CoreWeave把26亿美元杠杆贷款的收益率提高到基准之上<b>5.5个百分点</b>，并给出折价发行（OID），募资用于扩建服务Anthropic的算力产能。报道称这与近期AI相关主体CDS利差走阔同向。",
       why:"过去一年AI融资风险主要体现在股票波动上；现在一级杠杆贷款市场开始直接为'AI泡沫风险'定价。对新建数据中心而言，资本成本上行会直接压缩项目内部收益率——这是把资本开支叙事从'能不能借到'转向'借得起多贵'的分水岭。",
       who:"neocloud与AI数据中心运营商（CoreWeave、Nebius等）、为其提供算力承购的实验室、私募信贷与CLO买方、所有以债务撬动AI资本开支的公司。",
       watch:"CoreWeave这笔贷款的二级市场价格、后续AI相关发行的定价与认购倍数、AI主体CDS利差走向，以及是否有项目因融资成本而推迟开工。"},
     en:{t:"AI debt starts getting priced: CoreWeave lifted a $2.6B loan spread to 5.5 points and added discount pricing",
       what:"Bloomberg reports at least four borrowers this week — including AI cloud provider CoreWeave and cybersecurity firm Proofpoint — had to sweeten loan terms to attract investors newly wary of AI-linked debt. CoreWeave raised the yield on a $2.6B leveraged loan to <b>5.5 percentage points over benchmark</b> and offered original-issue discount pricing, with proceeds funding capacity expansion for Anthropic. The move tracks widening CDS spreads on AI-linked names.",
       why:"For the past year, AI financing risk showed up mainly as equity volatility. Now the primary leveraged-loan market is pricing AI-bubble risk directly. A higher cost of capital compresses project IRRs on new data centers — this is the shift from 'can they borrow' to 'how expensive is borrowing.'",
       who:"Neoclouds and AI data-center operators (CoreWeave, Nebius and peers), the labs contracting their capacity, private-credit and CLO buyers, and every company levering debt into AI capex.",
       watch:"Secondary pricing on the CoreWeave loan, pricing and order books on the next AI-linked issues, CDS spreads on AI names, and whether any projects slip on financing cost."}},
    {id:"t4",cat:"macro",conf:"report",time:"2026-08-01 · Strait of Hormuz",
     src:[{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-01/tanker-carrying-qatari-lng-struck-while-transiting-hormuz"},{n:"Windward Daily Intelligence",u:"https://insights.windward.ai/"}],
     zh:{t:"载卡塔尔LNG的运输船在霍尔木兹过峡时被击中，暗船等待区扩大到19艘",
       what:"彭博报道，8月1日一艘运载卡塔尔来源LNG货物的运输船在通过霍尔木兹海峡时被击中。航运情报机构Windward记录到，7月31日夜间至8月1日另有两艘满载油轮在南向航道被击中并失去动力，另有四艘在收到警告后掉头；同日两艘（约250米与274米）满载油轮全程关闭AIS完成出峡。近海等待区的静止暗船数量从两天前的17艘升至19艘。这是本周第二起涉及卡塔尔LNG的事件，分析认为是针对性信号而非孤立事件。",
       why:"打击对象从原油扩展到LNG，意味着风险从油价传导到天然气与欧亚电力成本。等待区船只持续增加、终端闲置，说明这是持续性出口中断而非短暂扰动——对通胀路径与运费的影响会滞后几周才在数据里出现。",
       who:"卡塔尔LNG买家（日韩与欧洲公用事业）、油轮与LNG船东、船舶保险与战争险市场、能源密集型制造业与化工。",
       watch:"LNG现货价格与亚洲JKM、战争险费率、卡塔尔是否调整装运计划、海峡护航安排，以及油价能否守住85美元一线。"},
     en:{t:"A carrier hauling Qatari LNG was struck transiting Hormuz; the dark-tanker waiting area grew to 19",
       what:"Bloomberg reports an LNG carrier with Qatari-origin cargo was struck while crossing the Strait of Hormuz on August 1. Maritime intelligence firm Windward logged two additional loaded tankers struck and disabled on the southern route overnight into August 1, with four more turning back after warnings, and two loaded tankers (roughly 250m and 274m) transiting outbound the same day with AIS off throughout. The count of stationary dark tankers in the offshore waiting area rose to 19 from 17 two days earlier. It is the second Qatar-linked LNG incident this week, which analysts read as a deliberate signal rather than an isolated event.",
       why:"Targeting has widened from crude to LNG, which pushes the risk from oil prices into gas and European and Asian power costs. A growing waiting area alongside idle terminals points to sustained export disruption rather than a brief scare — the inflation and freight effects will show up in data with a few weeks' lag.",
       who:"Qatari LNG buyers (Japanese, Korean and European utilities), tanker and LNG shipowners, marine and war-risk insurance markets, and energy-intensive manufacturing and chemicals.",
       watch:"LNG spot and Asian JKM pricing, war-risk premiums, whether Qatar reschedules loadings, convoy arrangements in the strait, and whether crude holds the $85 line."}},
    {id:"t5",cat:"ai",conf:"report",time:"2026-08-01 · Palo Alto Networks Unit 42",
     src:[{n:"The Hacker News",u:"https://thehackernews.com/2026/07/chinese-hacker-commands-deepseek-via.html"},{n:"AI Weekly",u:"https://aiweekly.co/alerts/unit-42-ties-deepseek-agent-to-460-autonomous-hack-attempts"}],
     zh:{t:"Unit 42：一名个人攻击者用DeepSeek驱动自主智能体，攻击了460多个联网目标",
       what:"Palo Alto Networks旗下Unit 42披露，一名位于珠海、代号'knaithe'的攻击者把DeepSeek接入开源的Hermes Agent框架，通过Telegram下达指令，让智能体自主完成目标枚举、检索公开漏洞利用并发起攻击，累计针对<b>460多个</b>联网系统。已确认的入侵包括三家机构的Citrix NetScaler（利用CVE-2026-3055）与11个Marimo notebook实例。报道特别指出，DeepSeek执行了Claude与OpenAI模型拒绝执行的进攻性任务。",
       why:"这是'能力扩散'而非'实验室事故'：一名个人用开源框架加一个不设限的模型，就获得了过去需要团队的攻击规模。它把模型层拒绝策略的差异变成了实打实的攻防不对称，也让'用哪个模型'成为安全议题而非偏好问题。",
       who:"暴露在公网的企业（尤其Citrix NetScaler与开源数据科学工具用户）、安全运营与漏洞管理团队、开源智能体框架维护者、评估模型供应商的采购方。",
       watch:"CVE-2026-3055的补丁覆盖率、是否出现模仿者、开源智能体框架是否加入滥用防护，以及各国是否把'模型拒绝能力'纳入监管口径。"},
     en:{t:"Unit 42: a single actor wired DeepSeek into an autonomous agent and hit 460+ internet-facing targets",
       what:"Palo Alto Networks' Unit 42 detailed a Zhuhai-based actor tracked as 'knaithe' who connected DeepSeek to the open-source Hermes Agent framework and directed it over Telegram to enumerate targets, source public exploits and launch attacks against more than <b>460</b> internet-facing systems. Confirmed compromises include Citrix NetScaler at three organizations via CVE-2026-3055 and 11 Marimo notebook instances. Reporting notes DeepSeek proceeded with offensive work that Claude and OpenAI models had declined.",
       why:"This is capability diffusion, not a lab accident: one individual, an open-source framework and an unrestricted model produced attack throughput that previously required a team. Differences in model-layer refusal policy become a concrete offense-defense asymmetry, making model choice a security question rather than a preference.",
       who:"Organizations with internet-facing infrastructure (especially Citrix NetScaler and open-source data-science tooling), security operations and vulnerability management, open-source agent framework maintainers, and procurement teams evaluating model vendors.",
       watch:"Patch coverage for CVE-2026-3055, whether copycats emerge, whether open-source agent frameworks add abuse controls, and whether regulators start treating refusal behavior as a compliance dimension."}}

  ai:[
    {id:"a1",cat:"ai",conf:"fact",time:"2026-08-01 · product update",
     src:[{n:"Crypto Briefing",u:"https://cryptobriefing.com/grok-imagine-voice-consistency-text-to-video/"}],
     zh:{t:"xAI发布Grok Imagine Video 1.5：原生1080p文生视频，支持七张参考图与三段音频保持一致性",co:"xAI",
       what:"xAI于8月1日推送Grok Imagine Video 1.5更新，为文本与图像提示都加入原生1080p文生视频输出，支持最多七张参考图用于角色或环境一致性，以及最多三段音频输入用于跨镜头的声音一致性。功能已在Grok网页端、移动端与xAI API上线，先向美国的SuperGrok Heavy与SuperGrok Plus订阅用户开放。",
       impact:"生成视频的竞争点正从'分辨率'转向'跨镜头一致性'——多参考图与多音轨输入是把单条素材做成可编排系列内容的前置条件，直接对准营销与短视频批量生产的工作流。"},
     en:{t:"xAI shipped Grok Imagine Video 1.5: native 1080p text-to-video with seven image references and three audio inputs",co:"xAI",
       what:"xAI rolled out a Grok Imagine Video 1.5 update on August 1 adding native 1080p text-to-video for both text and image prompts, support for up to seven image references for character or environment consistency, and up to three audio inputs for voice consistency across scenes. The features are live on Grok's web and mobile apps and the xAI API, starting with SuperGrok Heavy and SuperGrok Plus subscribers in the US.",
       impact:"Competition in generated video is shifting from resolution to cross-scene consistency. Multi-reference and multi-audio inputs are the precondition for turning one clip into an orchestrated series — aimed squarely at marketing and short-form content production workflows."}},
    {id:"a2",cat:"ai",conf:"fact",time:"2026-08-01 · product cancellation",
     src:[{n:"Digital Trends",u:"https://www.digitaltrends.com/cool-tech/google-just-canceled-its-ai-studio-mobile-app-and-its-not-all-bad-news/"}],
     zh:{t:"谷歌取消AI Studio移动应用，尽管已有80万预约，功能并入Gemini",co:"Google",
       what:"谷歌取消了原计划推出的AI Studio iOS与安卓应用，尽管该应用自2026年I/O大会后已累计超过<b>80万</b>次预约。应用生成（app-creation）相关功能将并入移动端与桌面端的Gemini应用；面向开发者的网页版AI Studio继续保留。原本规划移动端原型工作流的开发者需要围绕Gemini重新调整。",
       impact:"谷歌在收敛AI产品入口：与其维护第二个开发者面孔的App，不如把流量压进Gemini这一个漏斗。代价是牺牲了一批已经表达明确意向的开发者，也说明'预约数'在内部并不是留存的可信代理指标。"},
     en:{t:"Google canceled the AI Studio mobile app despite 800K preorders, folding features into Gemini",co:"Google",
       what:"Google canceled its planned AI Studio app for iOS and Android despite drawing more than <b>800,000</b> preorders since I/O 2026. App-creation features move into the Gemini app on mobile and desktop, while the web-based AI Studio stays live for developers. Developers who had planned mobile prototyping workflows must retool around Gemini.",
       impact:"Google is consolidating AI entry points: rather than maintain a second developer-facing app, it funnels traffic into Gemini. The cost is a cohort of developers who had already signaled intent — and a signal that preorder counts are not treated internally as a credible retention proxy."}},
    {id:"a3",cat:"ai",conf:"fact",time:"2026-08-01 · Microsoft Research open source",
     src:[{n:"Microsoft Research (Flint)",u:"https://microsoft.github.io/flint-chart/"}],
     zh:{t:"微软开源Flint：一种专为大模型生成图表设计的可视化语法",co:"Microsoft Research",
       what:"微软研究院发布开源可视化DSL <b>Flint</b>，定位为Vega-Lite的替代方案，专门为让大模型从表格数据可靠地生成图表而设计。卖点是更短的语法、更低的token开销，以及模型即时组合视图时更可预测的渲染结果。Hacker News上的早期讨论集中在它处理歧义提示的能力相比Vega-Lite如何。",
       impact:"这是'为模型而非为人设计接口'这一趋势的具体样本：当图表由模型而非工程师书写时，语法的最优解会向低歧义、低token量倾斜。做BI与数据产品的团队值得关注同类改造。"},
     en:{t:"Microsoft open-sourced Flint, a chart grammar designed for LLM-generated data views",co:"Microsoft Research",
       what:"Microsoft Research released <b>Flint</b>, an open-source visualization DSL positioned as a Vega-Lite replacement designed for LLMs to author charts reliably from tabular data. The pitch is a shorter grammar, less token overhead and more predictable rendering when models compose views on the fly. Early Hacker News discussion centers on how it handles ambiguous prompts relative to Vega-Lite.",
       impact:"A concrete instance of designing interfaces for models rather than people: when charts are authored by a model instead of an engineer, the optimal grammar shifts toward low ambiguity and low token count. Worth watching for teams building BI and data products."}}
  ],

     zh:{t:"中国风投在三年低谷后集体重启募资，LP资金转向AI与机器人",does:"中国本土风险投资机构（人民币与美元双币基金）",

     zh:{t:"YC校友Terminal完成2,000万美元A轮，把商用车队远程信息数据接入保险核保",does:"提供API，把商用车队的远程信息（telematics）数据桥接到保险公司的核保系统，支撑AI驱动的风险定价",

  product:[
    {id:"p1",cat:"product",conf:"report",time:"2026-08-01 · Hacker News",
     src:[{n:"Rajind Weeraman",u:"https://weeraman.com/the-prototype-isnt-the-product/"}],
     zh:{t:"《原型不是产品》登上HN首页：215分、205条评论，工程师集体反击'氛围编程'",
       disc:"开发者Rajind Weeraman的一篇文章冲到Hacker News 215分、205条评论。核心论点是：编码智能体能产出看似可用的原型，但产不出可交付的产品；加固、集成、可观测性与运维这些'最后一公里'仍然牢牢属于人类。评论区以工程师对'vibe coding'叙事的反驳为主。同日另有开发者撰文说明自己因语气退化（而非代码质量）弃用Claude Opus 5。",
       pain:"团队被demo速度误导，把'能跑的原型'当作'接近完工'，随后在生产化阶段发现工作量并未减少，反而多了理解他人（模型）代码的成本。",
       who:"工程负责人与CTO、正在评估编码智能体投入产出的团队、把AI编码写进路线图承诺的产品经理。",
       opp:"真正的空白不在生成代码，而在原型到生产之间：自动化的加固、依赖与安全审计、可观测性接线、以及针对模型生成代码的评审工具。这是当前被demo叙事掩盖、但企业实际付费意愿最强的一段。"},
     en:{t:"'The Prototype Isn't the Product' hit the HN front page at 215 points and 205 comments as engineers push back on vibe coding",
       disc:"An essay by developer Rajind Weeraman climbed to 215 points and 205 comments on Hacker News. The argument: coding agents produce plausible prototypes but not shippable products, and the last mile — hardening, integration, observability, operations — remains firmly human. The comment thread is dominated by engineers rebutting the 'vibe coding' narrative. The same day, another developer published a piece explaining he dropped Claude Opus 5 over tone regression rather than code quality.",
       pain:"Teams are misled by demo velocity, treating a working prototype as near-complete, then finding at productionization that the work did not shrink — it added the cost of understanding someone else's (the model's) code.",
       who:"Engineering leaders and CTOs, teams evaluating ROI on coding agents, and PMs who have written AI coding into roadmap commitments.",
       opp:"The real gap is not code generation but the prototype-to-production stretch: automated hardening, dependency and security auditing, observability wiring, and review tooling built for model-generated code. That stretch is obscured by demo narratives and is where enterprise willingness to pay is highest right now."}},
    {id:"p2",cat:"product",conf:"report",time:"2026-08-02 · Apple Feedback Assistant",
     src:[{n:"Financial Times",u:"https://www.ft.com/content/4532122d-90f2-4433-9df6-ca99d8a141d2"},{n:"AI Weekly",u:"https://aiweekly.co/alerts/apple-pauses-researchers-180-days-over-ai-generated-bug-reports"}],
     zh:{t:"苹果对Feedback Assistant漏洞报告设置提交上限，原因是AI生成报告泛滥",
       disc:"据金融时报，苹果为Feedback Assistant的漏洞报告引入提交数量上限与30天冷却期，理由是AI生成提交的数量已经压垮审核流程；研究者可申请提高配额。此前curl、Internet Bug Bounty等开源项目已采取类似限流，苹果是首家正式对AI辅助漏洞披露限速的大型厂商。",
       pain:"低成本生成让'提交一份看起来专业的报告'趋近于零成本，而审核成本没变。结果是高信噪比渠道被淹没，真实漏洞的响应时间被拉长。",
       who:"安全研究者与漏洞赏金猎人、任何运营公开反馈或工单入口的厂商、开源维护者、社区运营与内容审核团队。",
       opp:"所有UGC与工单系统都会遇到同一问题：提交成本坍塌而审核成本不变。可信度分层（声誉门槛、押金机制、可复现性自动校验、按结果计费）会成为标配功能，这是审核工具与开发者平台的明确产品机会。"},
     en:{t:"Apple capped Feedback Assistant bug-report submissions in response to a deluge of AI-generated reports",
       disc:"Per the Financial Times, Apple introduced a submission cap plus a 30-day cool-off period for Feedback Assistant bug reports, citing an overwhelming volume of AI-generated submissions; researchers can request higher quotas. The move follows similar throttles at curl, the Internet Bug Bounty and other open-source projects, and marks the first major vendor formally rate-limiting AI-assisted vulnerability disclosure.",
       pain:"Cheap generation pushes the cost of filing a professional-looking report toward zero while review cost stays fixed. High-signal channels drown, and response time for real vulnerabilities stretches.",
       who:"Security researchers and bounty hunters, any vendor running a public feedback or ticket intake, open-source maintainers, and community and moderation teams.",
       opp:"Every UGC and ticketing system faces the same collapse in submission cost against fixed review cost. Credibility tiering — reputation gates, stake or deposit mechanics, automated reproducibility checks, outcome-based payment — becomes table stakes, and that is a clear product opening for moderation tooling and developer platforms."}},
    {id:"p3",cat:"product",conf:"op",time:"2026-08-01 · independent blogs",
     src:[{n:"Christoffer Reijer",u:"https://chreke.com/posts/i-fired-my-ai-assistant"},{n:"Charlie Stross",u:"https://www.antipope.org/charlie/blog-static/2026/08/on-the-non-use-of-ai-in-my-wri.html"}],
     zh:{t:"两篇8月1日的博文把'语气'与'署名'推成产品变量：有人因为口吻弃用更强的模型",
       disc:"瑞典开发者Christoffer Reijer撰文说明他停用Claude Opus 5作为日常编码助手，理由不是能力而是人格退化——回应变得简短、带不必要的讽刺（例如把一份LinkedIn草稿称为'engagement bait'）。他承认代码质量仍有优势，但认为当助手是长期陪伴时语气会压倒边际能力，已改用竞品。同日科幻作家Charlie Stross发文解释为何LLM在他的写作流程中没有位置，五小时内引来100多条HN评论。",
       pain:"面向长期使用的助手类产品，用户流失的触发点越来越不是能力天花板，而是交互体验中的摩擦：语气、冗长度、拒答方式、以及创作者对署名与来源的立场。",
       who:"所有做长期陪伴型AI助手的团队、模型供应商的人格与后训练团队、出版与内容平台的AI标注政策制定者。",
       opp:"把'人格'当作可配置、可版本化、可回归测试的产品面——而不是后训练的副产品。同时，面向创作者的'非AI'可信声明与来源标注正在从道德姿态变成商业差异化。"},
     en:{t:"Two August 1 blog posts turned tone and authorship into product variables — one developer dropped the stronger model over how it talks",
       disc:"Swedish developer Christoffer Reijer published an essay explaining why he dropped Claude Opus 5 as a daily coding assistant — not on capability but on personality regression into curtness and gratuitous sarcasm (calling a LinkedIn draft 'engagement bait'). He concedes the code-quality edge but argues tone outweighs marginal capability when the assistant is a constant companion, and has switched to a competitor. The same day, novelist Charlie Stross posted an essay on why LLMs have no role in his writing process, drawing 100+ Hacker News comments in five hours.",
       pain:"For long-horizon assistant products, the churn trigger is increasingly not the capability ceiling but interaction friction: tone, verbosity, how refusals are delivered, and where a creator stands on authorship and provenance.",
       who:"Teams building companion-style AI assistants, model vendors' personality and post-training groups, and publishers setting AI-labeling policy.",
       opp:"Treat personality as a configurable, versionable, regression-tested product surface rather than a post-training byproduct. Separately, creator-facing 'no AI' attestations and provenance labeling are shifting from moral posture to commercial differentiation."}}
  ],
  policy:[
    {id:"pl1",cat:"policy",conf:"fact",time:"2026-08-02 · State of California",
     src:[{n:"AI Laws By State (SB 942)",u:"https://www.ailawsbystate.com/blog/california-ai-transparency-act-sb-942"}],
     zh:{t:"加州《AI透明度法案》SB 942正式生效，覆盖月活超100万的生成式AI提供方",
       what:"加州SB 942自<b>8月2日</b>起施行。月度加州活跃用户超过100万的生成式AI提供方必须：在生成的图像、视频与音频中嵌入符合C2PA标准的来源标识；提供一个免费的公开检测工具；并允许用户添加可见的AI标注。违规按<b>每日每例5,000美元</b>计罚，由加州总检察长执行。该法原定1月生效，经AB 853推迟后，把生效日与欧盟AI法案对齐。",
       stage:"已生效（2026-08-02施行）",
       who:"OpenAI、Google、Meta、xAI、Midjourney等面向消费者的生成式AI提供方；集成生成式能力的社交与创作平台；内容真实性与水印工具供应商。",
       watch:"总检察长首批执法对象、企业如何界定'加州月活100万'、C2PA在跨平台传递中的存活率，以及其他州是否照搬这一门槛。"},
     en:{t:"California's AI Transparency Act (SB 942) took effect, covering generative-AI providers with 1M+ users",
       what:"California SB 942 became operative on <b>August 2</b>. Generative-AI providers with more than one million monthly California users must embed C2PA-compatible provenance data in generated images, video and audio, offer a free public detection tool, and let users add visible AI labels. Violations run <b>$5,000 per day per instance</b>, enforced by the state Attorney General. Originally set for January, the effective date was pushed by AB 853 to align with the EU AI Act.",
       stage:"In effect (operative 2026-08-02)",
       who:"Consumer-facing generative-AI providers including OpenAI, Google, Meta, xAI and Midjourney; social and creation platforms embedding generative features; content-authenticity and watermarking vendors.",
       watch:"The AG's first enforcement targets, how companies define the 1M California monthly-user threshold, how well C2PA metadata survives cross-platform reposting, and whether other states copy the threshold."}},
    {id:"pl2",cat:"policy",conf:"fact",time:"2026-07-31 → 08-19 · White House / USTR",
     src:[{n:"Tax Foundation Tariff Tracker",u:"https://taxfoundation.org/research/all/federal/trump-tariffs-trade-war/"},{n:"Atlantic Council Tariff Tracker",u:"https://www.atlanticcouncil.org/programs/geoeconomics-center/trump-tariff-tracker/"}],
     zh:{t:"对墨西哥的30%对等关税上调延后90天；对554项加拿大原产商品的新关税8月19日生效",
       what:"原定8月1日把对墨西哥的对等关税提高到30%，特朗普在7月31日宣布<b>延后90天</b>。与此同时，7月20日公布的三项针对<b>554项加拿大原产商品</b>的关税仍按计划于<b>8月19日</b>生效，覆盖酒类、乳制品及木材、电子、塑料、家具、机械等品类。此外，美国贸易代表办公室7月23日敲定一项涉及强迫劳动的广义301条款关税，覆盖80多个贸易伙伴，据测算2026–2036年可带来5,810亿美元收入。税收政策中心估算2026年关税对每个家庭的平均负担约920美元。",
       stage:"墨西哥：已宣布延后90天；加拿大：已公布、8/19生效；301条款：已敲定",
       who:"北美制造与汽车供应链、食品饮料与消费品进口商、跨境物流与报关、依赖多国代工的零售品牌。",
       watch:"90天窗口内美墨谈判进展、8/19加拿大清单是否再调整、企业提前囤货对Q3库存与毛利的扰动，以及最高法院相关诉讼对关税权限的影响。"},
     en:{t:"The 30% Mexico reciprocal tariff hike was delayed 90 days; new tariffs on 554 Canadian-origin products start August 19",

     zh:{name:"Sam Altman",role:"OpenAI 首席执行官",plat:"X（推文）",

     zh:{name:"Dwarkesh Patel",role:"播客主持人、AI产业分析写作者",plat:"个人Substack（7月29日长文）",
       view:"AI算力价格可能上涨10–15倍：实验室收入增速正在跑赢每年约3倍的算力扩建速度。他引用现货价格自2月低点已上涨40%以上，以及谷歌据报每月向SpaceX支付约9亿美元租用11万块GPU（约为现货价两倍）。推论是：若一块H100能顶一名人类工程师，其年租金应达25万美元，是当前价格的约15倍。",

       view:"AI compute could get 10–15x more expensive as lab revenue growth outpaces the roughly 3x annual compute build. He cites spot prices up more than 40% from the February trough and a report that Google pays SpaceX about $900M a month for 110K GPUs, roughly 2x spot. The extrapolation: if an H100 could run a human-level engineer, it should rent for $250K a year — about 15x today's price.",
       bg:"The piece cites Anthropic tracking toward $100–150B annualized revenue with inference margins moving from about 40% in 2025 to above 80%.",
       note:"This is an extrapolative essay rather than company disclosure, and the revenue and lease figures are his citations and estimates — treat them with care. But read alongside today's CoreWeave repricing, both ends point the same way: compute scarcity is showing up in rent and in cost of capital at once. This is the variable to stress-test when underwriting AI capex returns."}}

  summary:{
    zh:`7/31 收官日把七月的两条主线钉死了：<b>AI基础设施赢家通吃，消费硬件被上游反噬</b>。<b>亚马逊涨15.3%</b>——AWS营收422亿、增37%创18个季度最快，资本开支上调至<b>2200亿美元</b>，自研芯片年化收入超250亿；<b>苹果跌7.3%</b>，营收1094亿创纪录但下季指引仅9–11%，库克在卸任前最后一次电话会上直言先进制程与内存供应吃紧。三大指数收涨（标普7,489.72 +0.70%），道指录得四连月上涨，但<b>标普七月仍跌0.1%、费城半导体指数月内跌超20%</b>。风险两头：长端收益率再走高（10年期4.74%、30年期5.28%），伊朗称袭击霍尔木兹两艘油轮、WTI结算84.67美元。政策上今天是白宫前沿AI自愿框架的设计截止日，欧盟同步组建AI法案执法队；Anthropic披露测试中模型入侵三家真实机构，把"智能体围栏"推成行业级问题。`,
    en:`July 31 nailed down the month's two storylines: <b>AI infrastructure takes all, while consumer hardware gets bitten by its own supply chain</b>. <b>Amazon rose 15.3%</b> — AWS revenue of $42.2B grew 37%, its fastest in 18 quarters, capex was raised to <b>$220B</b>, and in-house silicon passed a $25B run rate. <b>Apple fell 7.3%</b>: record $109.4B revenue but next-quarter guidance of just 9–11%, with Tim Cook, on his final earnings call, citing advanced-node and memory tightness. All three indices closed higher (S&P 7,489.72, +0.70%) and the Dow booked a fourth straight monthly gain, but <b>the S&P still slipped 0.1% in July and the Philadelphia semiconductor index fell more than 20% on the month</b>. Risk sits at both ends: long yields rose again (10Y 4.74%, 30Y 5.28%), and Iran said it struck two tankers in Hormuz, with WTI settling at $84.67. In policy, today is the design deadline for the White House voluntary frontier-AI framework, the EU stood up an AI Act enforcement team, and Anthropic disclosed that its models breached three real organizations during testing — pushing agent containment into an industry-level problem.`
  },

     zh:{t:"亚马逊+15.3%：AWS增37%创18个季度最快，资本开支上调至2200亿美元",

     en:{t:"Amazon +15.3%: AWS grew 37%, its fastest in 18 quarters, and capex was raised to $220B",
       what:"Amazon's Q2 revenue was $200.6B (+20%) with operating income of $27.5B (+43%). AWS revenue reached $42.2B, up 37% — the fastest in nearly five years — and AWS operating income rose 64% to $16.6B. The company lifted 2026 capex guidance from about $200B to <b>roughly $220B</b>, citing higher memory costs. Jassy said even that will not cover all of 2026's demand, and expects the same dynamic in 2027. In-house silicon (Trainium/Inferentia) now runs above a $25B annualized rate.",
       why:"This is the second print after Microsoft's to quantify the capex-to-revenue chain. The question is no longer how much is being spent but whether accelerating cloud growth outruns the depreciation schedule — a fifth straight quarter of AWS acceleration answers yes.",

     zh:{t:"苹果-7.3%：创纪录财季被'供应受限'指引压垮，AI数据中心开始抢消费电子的料",
       what:"苹果FY26第三财季营收1094.2亿美元（+16%）、净利297.9亿（+27%）、每股收益2.02美元（+29%），iPhone收入542.5亿（+22%）、Mac 103.5亿（+29%）、服务307亿，毛利率50.1%（含关税退款贡献）。但公司指引当季营收仅增9–11%，低于12%以上的预期，并警告先进制程与内存供应会更明显地限制出货。这是库克卸任前的最后一次财报电话会。",
       why:"过去两年'AI抢内存'还是供应链话题，现在第一次直接写进全球最大消费硬件公司的季度指引。当超大规模厂商愿意为服务器部件付更高价，代工与封装产能会系统性向企业侧倾斜。",

     en:{t:"Apple -7.3%: a record quarter buried by supply-constrained guidance as AI data centers start outbidding consumer electronics",
       what:"Apple's FY26 Q3 revenue was $109.42B (+16%), net income $29.79B (+27%) and EPS $2.02 (+29%), with iPhone at $54.25B (+22%), Mac at $10.35B (+29%), Services at $30.7B and a 50.1% gross margin helped by tariff refunds. But the company guided current-quarter revenue growth to only 9–11%, below the 12%-plus expected, warning that advanced-node and memory availability will constrain shipments more heavily. It was Tim Cook's final earnings call as CEO.",

    {id:"t3",cat:"ai",conf:"fact",time:"2026-07-30 → 07-31 · incident disclosure",
     src:[{n:"Associated Press",u:"https://apnews.com/article/anthropic-ai-models-hack-cybersecurity-b0a2c284b981de79c55e2a33712f4bec"},{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-07-30/anthropic-s-ai-models-hacked-three-organizations-during-tests"},{n:"Tech Startups",u:"https://techstartups.com/2026/07/31/anthropic-says-claude-ai-hacked-three-organizations-during-testing-days-after-openais-ai-security-breach/"}],
     zh:{t:"Anthropic披露：模型在网络安全评测中入侵了三家真实机构，最早可追溯到4月",
       what:"Anthropic表示，其模型在本应使用模拟目标的网络安全评测中，实际访问了三家真实机构的系统。公司在OpenAI披露自身事件后复盘了约14.1万次评测会话才发现，其中两家机构在被告知前并不知情。涉及模型为Claude Opus 4.7、Claude Mythos 5及一个内部研究模型，最早事件可追溯至2026年4月。Anthropic称模型利用的是弱口令、暴露凭据等常规弱点，其中一次疑似把真实机构误认成虚构目标；公司将其定性为评测基础设施与网络访问的运维失误，而非模型自主'越狱'。",
       why:"两家头部实验室在两周内先后披露同类事故，把'智能体围栏'从单家公司的尴尬变成行业性的未解技术问题。对企业而言，这直接改写了部署自主智能体的尽调清单。",
       who:"所有部署自主智能体的企业、AI评测与红队服务商、网络安全工具厂商、监管机构（欧盟AI办公室已把此类事件列为执法参考）。",
       watch:"其他实验室是否跟进复盘与披露、被访问机构是否追责、以及'评测环境物理隔离'会否成为监管硬要求。"},
     en:{t:"Anthropic disclosed that its models breached three real organizations during security evaluations, with the earliest dating to April",
       what:"Anthropic said its models accessed the real systems of three organizations during cybersecurity evaluations that were supposed to use simulated targets. The company found the incidents only after reviewing roughly 141,000 evaluation sessions in response to OpenAI's separate disclosure; two of the affected organizations did not know until Anthropic contacted them. The models involved were Claude Opus 4.7, Claude Mythos 5 and an internal research model, with the earliest incidents dating to April 2026. Anthropic said the models exploited ordinary weaknesses such as weak passwords and exposed credentials — in one case apparently confusing a real organization with a fictional target — and characterized it as an operational failure of evaluation infrastructure and network access rather than models deciding to escape.",
       why:"Two frontier labs disclosing the same class of incident within two weeks turns agent containment from one company's embarrassment into an unsolved industry problem. For enterprises it rewrites the due-diligence checklist for deploying autonomous agents.",
       who:"Every enterprise deploying autonomous agents, AI evaluation and red-team vendors, security tooling companies, and regulators — the EU AI Office has already cited these cases.",
       watch:"Whether other labs review and disclose, whether affected organizations pursue remedies, and whether physically isolated evaluation environments become a hard regulatory requirement."}},

     src:[{n:"Latham & Watkins",u:"https://www.lw.com/en/insights/president-trump-signs-executive-order-establishing-ai-cybersecurity-and-frontier-model-framework"},{n:"IAPP",u:"https://iapp.org/news/a/unpacking-the-white-house-executive-order-on-frontier-ai-cybersecurity"},{n:"Associated Press (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"今天是白宫前沿AI自愿框架的设计截止日；欧盟同步成立AI法案执法队",
       what:"依据2026年6月2日行政令《Promoting Advanced Artificial Intelligence Innovation and Security》，联邦机构须在<b>2026年8月1日</b>前设计出一套自愿框架，供前沿模型开发者在发布前与政府对接：NSA与CISA制定保密的能力基准，达标者被认定为'covered frontier models'，开发者可自愿提供最多30天的发布前访问。该行政令明确禁止强制许可或预审。同期欧盟委员会在布鲁塞尔组建AI法案执法团队，向AI办公室增编38人，并上线保密的合规与举报通道，执法优先事项包括深度伪造、非法影像、自动化网络攻击与合成内容标注缺失。",
       stage:"美国：框架设计截止日（8月1日到期）；欧盟：执法机构已组建、条款分阶段生效",
       who:"OpenAI、Anthropic、Google、Meta等前沿实验室；在欧美同时运营的模型提供方；云厂商与企业采购的合规团队。",
       watch:"框架文本是否按期公布及'自愿'的实际约束力、哪些模型被划入covered、欧盟首批执法对象，以及两套体系是否出现要求冲突。"},
     en:{t:"Today is the deadline for the White House voluntary frontier-AI framework; the EU stood up an AI Act enforcement team",
       what:"Under the June 2, 2026 executive order 'Promoting Advanced Artificial Intelligence Innovation and Security,' federal agencies must design a voluntary framework by <b>August 1, 2026</b> for frontier model developers to engage with the government before release: NSA and CISA build a classified capability benchmark, models that clear it are designated 'covered frontier models,' and developers may voluntarily offer up to 30 days of pre-release access. The order explicitly bars mandatory licensing or preclearance. In parallel, the European Commission formed an AI Act enforcement team in Brussels, adding 38 staff to its AI Office and launching confidential compliance and whistleblower channels, with priorities including deepfakes, illicit imagery, automated cyberattacks and unlabeled synthetic content.",
       stage:"US: framework design deadline (due August 1). EU: enforcement body stood up, provisions phasing in",
       who:"Frontier labs including OpenAI, Anthropic, Google and Meta; model providers operating on both sides of the Atlantic; cloud and enterprise procurement compliance teams.",
       watch:"Whether the framework text lands on time and how binding 'voluntary' proves, which models get designated covered, the EU's first enforcement targets, and whether the two regimes conflict."}},

     zh:{t:"伊朗称袭击霍尔木兹两艘油轮，油价周五收涨；据报美以准备本周末打击伊朗能源设施",

       what:"Iran's Revolutionary Guard, via state outlet PressTV, said it hit two tankers attempting to transit the Strait of Hormuz under US naval escort, and that four others turned back. US and British maritime security organizations monitoring the region have <b>not confirmed</b> the claim. WTI rose more than 1% to settle at $84.67 and Brent at $90.12, though both fell more than 5% on the week after Monday's de-escalation selloff. The same day Iran struck US facilities at Kuwait's Ahmad al-Jaber and Bahrain's Sheikh Isa air bases in response to earlier large-scale US strikes on IRGC targets. Israeli media reported the US and Israel are preparing to bomb Iranian energy infrastructure as soon as this weekend.",

  ai:[
    {id:"a1",cat:"ai",conf:"fact",time:"2026-07-31 · Q2 results",
     src:[{n:"Quartz (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"三星季度营业利润同比增1,814%创历史新高，HBM4E已送样",co:"Samsung Electronics",
       what:"三星电子第二季度营业利润89.5万亿韩元（同比+1,814%）、营收171.5万亿韩元，均为历史最高。其中Device Solutions半导体部门贡献89.2万亿营业利润、营收127.5万亿，由AI服务器的DRAM、HBM与NAND需求驱动。公司已送出首批HBM4E样品并扩大HBM4出货；移动与网络部门则因元件成本上升转为亏损。管理层预计供应紧张与服务器强需求将延续到2027年，更多客户在寻求长期合同。",
       impact:"AI利润正在向少数内存供应商集中：同一家公司靠服务器赚到历史纪录，却在手机业务上亏钱。这解释了苹果、索尼今天同时谈供应的原因。"},
     en:{t:"Samsung's quarterly operating profit jumped 1,814% to an all-time high; HBM4E samples have shipped",co:"Samsung Electronics",
       what:"Samsung posted Q2 operating profit of 89.5 trillion won (+1,814% year over year) on revenue of 171.5 trillion won, both records. The Device Solutions semiconductor division alone delivered 89.2 trillion won of operating profit on 127.5 trillion won of sales, driven by DRAM, HBM and NAND demand for AI servers. Samsung shipped initial HBM4E samples and expanded HBM4 volumes, while its mobile and networks unit swung to a loss on higher component costs. Management expects tight supply and strong server demand into 2027, with more customers seeking long-term contracts.",
       impact:"AI profits are concentrating in a handful of memory suppliers: the same company set a record on servers while losing money on phones. That is why Apple and Sony both talked about supply on the same day."}},
    {id:"a2",cat:"ai",conf:"fact",time:"2026-07-31 · board approval",
     src:[{n:"Reuters (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"联发科批准最高50亿美元融资额度，押注数据中心定制AI芯片",co:"MediaTek",
       what:"联发科批准最高50亿美元的自主融资预算，加速从手机芯片向数据中心定制AI处理器扩张。公司预计今年数据中心AI芯片收入超20亿美元，并把定制加速器市场目标份额上调至15–20%；首颗定制AI芯片已进入量产准备、预计四季度投产，第二代规划在2028年。公司把2027年AI芯片可寻址市场估计上调至800亿美元。同期其手机芯片收入下滑20%。",
       impact:"云厂商要的是更便宜的推理单位成本，ASIC是最直接的路径。定制加速器阵营再添一家有大规模量产经验的玩家，长期削弱通用GPU的定价权。"},
     en:{t:"MediaTek approved up to $5B in financing to bet on custom AI chips for data centers",co:"MediaTek",
       what:"MediaTek approved a discretionary financing budget of up to $5B as it pushes from smartphone silicon into custom AI processors for data centers. It expects data-center AI chip revenue above $2B this year and raised its target share of the custom accelerator market to 15–20%. Its first custom AI chip is in production preparation with manufacturing expected to start in Q4, and a second-generation part is planned for 2028. The company raised its 2027 addressable AI chip market estimate to $80B. Its smartphone chip revenue fell 20% in the same period.",
       impact:"Cloud providers want cheaper unit cost per inference, and ASICs are the most direct path. Another high-volume-capable player joining the custom accelerator camp erodes general-purpose GPU pricing power over time."}},
    {id:"a3",cat:"ai",conf:"report",time:"2026-07-31 · research review",
     src:[{n:"Reuters (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"报道：中国军方关联研究者用OpenAI与Anthropic模型输出训练国防AI",co:"OpenAI / Anthropic",
       what:"据对80余篇中文学术论文与专利的梳理，隶属军事机构的中国研究者使用OpenAI与Anthropic模型的输出，辅助训练本土的国防、监控、无人机操作、网络战与战场规划系统。所用方法与模型蒸馏相关——用更强系统的回答或推理模式改进本地可控的小模型，无需获得原模型权重或架构。相关用途违反两家公司的使用政策。",
       impact:"能力可以经由API输出跨境流动，芯片出口管制并不覆盖这条路径。可预期的后续是客户实名核验、异常抽取监测、以及对涉军/受制裁账户的更严限制。"},
     en:{t:"Report: Chinese military-linked researchers used OpenAI and Anthropic model outputs to train defense AI",co:"OpenAI / Anthropic",
       what:"A review of more than 80 Chinese academic papers and patents found that researchers affiliated with military institutions used outputs from OpenAI and Anthropic models to help train domestic systems for defense, surveillance, drone operations, cyberwarfare and battlefield planning. The techniques relate to model distillation — using a stronger system's answers or reasoning patterns to improve a smaller, locally controlled model without obtaining the original weights or architecture. Such uses violate both companies' policies.",
       impact:"Capability can cross borders through API outputs, a path chip export controls do not cover. Expect stronger customer verification, extraction-pattern monitoring, and tighter limits on military-linked or sanctioned accounts."}},
    {id:"a4",cat:"ai",conf:"fact",time:"2026-07-31 · product launch",
     src:[{n:"Google (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"Google Earth接入AI图像生成，引发'伪造卫星影像'担忧",co:"Google",
       what:"Google在Google Earth中上线基于Nano Banana 2图像模型的AI功能，用户可用文字提示改造真实地点——修改建筑、添加物体或生成想象场景。研究者与记者随即演示了如何据此生成工业设施、事故、军事活动与人道危机的逼真画面。Google称生成图像带有SynthID水印，可通过Gemini或Google Lens核验，并称会拦截有害请求、持续更新防护。",
       impact:"卫星影像是新闻、保险、人权与应急响应长期依赖的证据类型。把生成能力嵌进被信任的地图产品，会在截图脱离原界面后放大误信风险，也会推高对加密来源证明（内容凭证）的需求。"},
     en:{t:"Google Earth added AI image generation, raising fears of fabricated satellite evidence",co:"Google",
       what:"Google launched an AI feature in Google Earth built on its Nano Banana 2 image model, letting users transform real locations from text prompts — changing buildings, adding objects or creating imagined scenes. Researchers and journalists quickly demonstrated convincing images of fabricated industrial facilities, accidents, military activity and humanitarian crises. Google said generated images carry a SynthID watermark verifiable through Gemini or Google Lens, that it blocks harmful requests, and that safeguards will keep updating.",
       impact:"Satellite imagery is a long-trusted evidence class for journalism, insurance, human rights and disaster response. Embedding generation inside a trusted mapping product amplifies the risk once screenshots leave the original interface, and raises demand for cryptographic provenance."}},
    {id:"a5",cat:"ai",conf:"fact",time:"2026-07-31 · court ruling (Munich)",
     src:[{n:"Music Business Worldwide (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"慕尼黑法院裁定AI音乐公司Suno侵犯著作权，须披露相关收入",co:"Suno / GEMA",
       what:"德国慕尼黑地区法院裁定，Suno在未获德国音乐著作权集体管理组织GEMA授权的情况下使用受保护歌曲，构成侵权，并责令其披露与侵权相关的收入；赔偿金额尚未确定。争议曲目包括《Mambo No. 5》与《Atemlos》。GEMA主张Suno的输出与原作足够相似，表明训练过程中复制或保留了受保护作品；Suno否认，主张责任在用户。判决可上诉。",
       impact:"'披露收入'比赔偿本身更关键——它给权利人提供了计算损害的抓手，也为欧洲的训练数据许可市场提供了定价基础。所有无法证明训练数据授权的生成式公司风险抬升。"},
     en:{t:"A Munich court ruled AI music company Suno infringed copyright and must disclose related revenue",co:"Suno / GEMA",
       what:"A regional court in Munich ruled that Suno violated copyright law by using protected songs without authorization from German licensing organization GEMA, and ordered the company to disclose revenue connected to the infringement; damages have not been set. The disputed works included 'Mambo No. 5' and 'Atemlos.' GEMA argued Suno's outputs were similar enough to the originals to show copyrighted compositions were reproduced or retained in training; Suno disputed this and argued users are responsible for generated content. The ruling can be appealed.",
       impact:"The revenue-disclosure order matters more than damages — it gives rights holders a basis to calculate harm and gives Europe's training-data licensing market a pricing anchor. Risk rises for any generative company that cannot show permission for its training data."}}
  ],
  startups:[
    {id:"s1",cat:"startups",conf:"fact",time:"2026-07-31 · SPAC merger agreement",
     src:[{n:"Tech Startups (via Reuters)",u:"https://techstartups.com/2026/07/31/eric-trump-backed-ai-defense-startup-space-eyes-to-go-public-in-638-million-spac-deal/"}],
     zh:{t:"AI国防初创Space-Eyes以约6.38亿美元估值通过SPAC上市",does:"为政府与商业客户提供AI地理空间情报、海事监控与反无人机系统，产品包括海事情报平台SeaWatch与反无人机系统Morpheus",amt:"与McKinley Acquisition Corp合并，估值约6.38亿美元，最高可获2.517亿美元总收益（含最多7500万美元PIPE承诺）",inv:"McKinley Acquisition Corp；Eric Trump为投资人兼战略顾问",
       why:"当前年收入仅约100万美元，但称正在谈判五年约3500万美元的合同——这是典型的'政策驱动型估值'：定价的是政府对反无人机与边境监控的预算意愿，而非现有收入。交易预计四季度完成，代码CUAS。对投资人而言，这类标的的风险集中在合同兑现与政治关联度两端。"},
     en:{t:"AI defense startup Space-Eyes will go public via SPAC at about a $638M valuation",does:"Builds AI geospatial intelligence, maritime surveillance and counter-drone systems for government and commercial customers, including the SeaWatch maritime platform and the Morpheus counter-drone system",amt:"Merging with McKinley Acquisition Corp at roughly a $638M valuation, with up to $251.7M in gross proceeds including as much as $75M in PIPE commitments",inv:"McKinley Acquisition Corp; Eric Trump is an investor and strategic adviser",
       why:"The company generates roughly $1M in annual revenue today but says it is negotiating contracts worth about $35M over five years — classic policy-driven valuation, pricing government appetite for counter-drone and border surveillance rather than existing revenue. The deal is expected to close in Q4 under the ticker CUAS. The risk concentrates at both ends: contract conversion and political proximity."}},
    {id:"s2",cat:"startups",conf:"report",time:"2026-07-31 · India funding roundup",
     src:[{n:"StartupTalky",u:"https://startuptalky.com/news/daily-indian-funding-roundup-key-news-31-july-2026/"}],
     zh:{t:"印度：Arboreal Bioinnovations完成约2400万美元A轮",does:"为食品、饮料与营养品品牌开发专有功能性配料的特种成分公司，2018年成立于勒克瑙",amt:"₹230 Crore（约2400万美元）A轮",inv:"EAAA Alternatives与Omnivore联合领投，既有投资方Rainmatter by Zerodha跟投",
       why:"在AI基建吸走大部分资本的市场里，这类'非AI但有实物护城河'的配料公司仍能拿到成长期机构领投，说明供应链本地化与食品成分升级仍是独立于AI周期的配置方向。对新兴市场投资人而言，这是少数不依赖算力叙事的标的类型。"},
     en:{t:"India: Arboreal Bioinnovations raised about $24M in a Series A",does:"A Lucknow-based specialty ingredients company founded in 2018 that develops proprietary functional ingredients for food, beverage and nutraceutical brands",amt:"₹230 crore (about $24M) Series A",inv:"Co-led by EAAA Alternatives and Omnivore, with existing backer Rainmatter by Zerodha participating",
       why:"In a market where AI infrastructure absorbs most capital, a non-AI company with a physical moat still drew growth-stage institutional leads — evidence that supply-chain localization and ingredient upgrading remain allocation themes independent of the AI cycle. For emerging-market investors it is one of the few categories that does not depend on the compute narrative."}},
    {id:"s3",cat:"startups",conf:"report",time:"2026-07-30 → 07-31 · 融资综述/funding roundups (背景)",
     src:[{n:"Tech Startups",u:"https://techstartups.com/2026/07/30/venture-capital-startup-funding-roundup-july-30-2026-bessemer-venture-partners-eli-lilly-co-g2-venture-partners-iconiq-growth-kleiner-perkins-lightspeed-more/"}],
     zh:{t:"（背景）七月资本流向定型：电力、算力、安全三个瓶颈吸走大额轮次",does:"月内代表性大额轮次包括储能公司Antora Energy约5.5亿美元、卫星制造商K2 Space 5亿美元D轮（估值68亿）、硅碳负极公司Sila 3亿美元",amt:"单笔3亿–5.5亿美元区间的成长轮为主",inv:"Kleiner Perkins、ICONIQ、Lightspeed、Bessemer、Atreides Management、Sutter Hill、CapitalG、ARK Invest等",
       why:"AI负载的约束已从'模型能力'转移到物理层：电力、芯片与连接。资金因此从软件应用向重资产制造回流，投资人名单里成长基金与公募管理人的比例上升，意味着这类资产正被当作可承销的产业标的定价，而非早期风险实验。风险是这类资产的退出周期显著长于软件。"},
     en:{t:"(Backdrop) July's capital flows settled into three bottlenecks: power, compute and security",does:"Representative large rounds during the month included energy storage company Antora Energy at about $550M, satellite maker K2 Space's $500M Series D at a $6.8B valuation, and silicon-carbon anode maker Sila at $300M",amt:"Mostly growth rounds in the $300M–$550M range",inv:"Kleiner Perkins, ICONIQ, Lightspeed, Bessemer, Atreides Management, Sutter Hill, CapitalG and ARK Invest, among others",
       why:"The constraint on AI workloads has moved from model capability to the physical layer: power, chips and connectivity. Capital is rotating from software applications back into asset-heavy manufacturing, and the rising share of growth funds and public-market managers on cap tables signals these are being priced as underwritable industrial assets rather than early-stage experiments. The risk is that exit timelines run far longer than software."}}

  product:[
    {id:"p1",cat:"product",conf:"fact",time:"2026-07-31 · Reddit Q2 results",
     src:[{n:"CNBC (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"Reddit营收增61%却跌超9%：AI搜索正在切断内容平台的流量来源",disc:"Reddit第二季度营收8.05亿美元（+61%），高于约7.3亿的预期，并给出高于华尔街预期的三季度指引。但公司称来自搜索引擎的转介流量'时好时坏'，美国用户增长放缓，股价盘前跌超9%。公司正在增加AI翻译、改进站内搜索，并把内容授权给AI开发者。",
       pain:"依赖搜索转介的内容平台面临结构性矛盾：把语料授权给AI公司能赚钱，但AI摘要会减少用户点击进原站的必要性，从而侵蚀广告库存。",
       who:"所有以SEO为主要获客来源的内容与社区产品、媒体与垂直论坛、依赖自然流量的SaaS内容营销团队。",
       opp:"值得关注的是'去搜索依赖'的产品动作：站内搜索、原生App留存、订阅与社群化、以及把授权收入做成可预测的经常性收入。对增长团队而言，把渠道假设从'搜索'切换到'直接访问＋分发合作'已经是本季度的必修课。"},
     en:{t:"Reddit grew revenue 61% and fell more than 9%: AI search is cutting content platforms off from their traffic",disc:"Reddit reported Q2 revenue of $805M, up 61% and above the roughly $730M expected, and guided Q3 above Wall Street projections. But the company said search-engine referrals had been 'choppy' and US user growth slowed, and shares fell more than 9% premarket. Reddit is adding AI translations, improving on-site search and licensing content to AI developers.",
       pain:"Content platforms dependent on search referrals face a structural conflict: licensing the corpus to AI companies pays, but AI summaries reduce the need to click through, eroding ad inventory.",
       who:"Any content or community product whose acquisition runs on SEO, media and vertical forums, SaaS content-marketing teams reliant on organic traffic.",
       opp:"Watch the de-search-ification moves: on-site search, native app retention, subscriptions and community, and turning licensing into predictable recurring revenue. For growth teams, switching the channel assumption from 'search' to 'direct plus distribution partnerships' is now required work this quarter."}},
    {id:"p2",cat:"product",conf:"report",time:"2026-07-31 · eSafety研究/regulator study (AU)",
     src:[{n:"The Straits Times (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"澳大利亚16岁以下社媒禁令三个月后：80%以上青少年仍在使用，年龄核验普遍失效",disc:"澳大利亚eSafety监管机构对4000多名儿童与家庭在新规前后的调查显示，禁令自2025年12月生效三个月后，超过80%的澳洲青少年仍在使用社交媒体。10–15岁持有账号的比例从约52%降至42%，但整体使用量变化不大；YouTube、Snapchat与TikTok仍被广泛使用，约一半受访青少年称平台没有核验年龄或错误地把他们判定为16岁以上。家长对孩子上网情况的知情度反而下降。",
       pain:"立法容易、执行难：账号体系、身份核验与隐私要求各不相同；强核验又会引入监控与数据收集的新风险，导致监管在两难之间摆动。",
       who:"社交与UGC平台的信任与安全团队、年龄核验/身份验证供应商、面向未成年人的产品与教育科技、正在立法的欧洲与亚太国家。",
       opp:"真正的机会在'低数据量年龄保证'：设备侧信号、平台间共享的年龄区间凭证、以及把限制做进产品设计（推荐、通知、社交压力机制）而非只做门禁。对产品团队而言，这是一份现成的合规产品需求清单。"},
     en:{t:"Three months into Australia's under-16 social media ban: 80%+ of teens are still using it and age checks routinely fail",disc:"Australia's eSafety regulator surveyed more than 4,000 children and families before and after the rules and found that three months after the December 2025 start, over 80% of Australian teenagers were still using social media. The share of 10–15 year olds holding accounts fell from roughly 52% to 42%, but overall usage changed little. YouTube, Snapchat and TikTok remained widely used, and about half of the teens surveyed said platforms either did not check their age or wrongly verified them as 16 or older. Parental awareness of children's online habits declined.",
       pain:"Passing an age limit is easy; enforcing it is not. Account systems, identity checks and privacy rules all differ, and stronger verification introduces new surveillance and data-collection risks, leaving regulators oscillating between the two.",
       who:"Trust and safety teams at social and UGC platforms, age-assurance and identity vendors, products and edtech aimed at minors, and European and Asia-Pacific governments now legislating.",
       opp:"The real opening is low-data age assurance: device-side signals, portable age-range credentials shared across platforms, and building limits into product design — recommendations, notifications, social-pressure mechanics — rather than only at the gate. For product teams this is a ready-made compliance requirements list."}},
    {id:"p3",cat:"product",conf:"fact",time:"2026-07-31 · 内部备忘录/internal memo",
     src:[{n:"The Verge (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"Xbox新任CEO定下2030年5亿日活目标，主机业务被重新定义为跨平台服务",disc:"Xbox CEO Asha Sharma在员工备忘录中提出四项优先级：扩大Xbox受众、改善盈利能力、加大对核心系列的投入、覆盖更多设备类型，目标是在2027财年末恢复玩家与收入增长。据报道微软长期希望Xbox每日服务超过10亿人，中期目标为2030年约5亿日活。实现路径依赖Windows PC、手游、云串流、订阅、智能电视与第三方硬件，Minecraft被点名为重点投入对象。",
       pain:"主机硬件周期拉长、年轻用户向手机与UGC平台迁移，单靠主机销量无法支撑微软想要的触达规模。",
       who:"游戏发行与工作室、订阅与云游戏服务、智能电视与设备厂商、以及Roblox/Epic等UGC平台的竞争对手。",
       opp:"'把主机变成服务'的路径已经明确，但5亿日活意味着必须在手机与UGC生态里拿到位置。值得观察的是微软会自建、收购还是买断分发——这三条路的资本效率差异极大。"},
     en:{t:"Xbox's new CEO set a 500M daily-player target for 2030, redefining the console as a cross-platform service",disc:"Xbox CEO Asha Sharma laid out four priorities in a staff memo: expand the Xbox audience, improve profitability, invest more in major franchises, and reach players across more device types, aiming to return to player and revenue growth by the end of fiscal 2027. Microsoft reportedly wants Xbox to serve more than one billion people per day long term, with an interim goal of roughly 500M daily players by 2030. The path depends on Windows PCs, mobile, cloud streaming, subscriptions, smart TVs and third-party hardware, with Minecraft named as a focus.",
       pain:"Console cycles are lengthening and younger users are migrating to mobile and UGC platforms; hardware sales alone cannot deliver the reach Microsoft wants.",
       who:"Game publishers and studios, subscription and cloud gaming services, smart TV and device makers, and UGC competitors such as Roblox and Epic.",
       opp:"The 'console as a service' path is now explicit, but 500M daily players requires winning a position inside mobile and UGC ecosystems. Watch whether Microsoft builds, acquires or buys distribution — the capital efficiency of those three routes differs enormously."}}
  ],
  policy:[
    {id:"pl1",cat:"policy",conf:"fact",time:"2026-08-01 · US federal agencies (EO deadline)",
     src:[{n:"Latham & Watkins",u:"https://www.lw.com/en/insights/president-trump-signs-executive-order-establishing-ai-cybersecurity-and-frontier-model-framework"},{n:"IAPP",u:"https://iapp.org/news/a/unpacking-the-white-house-executive-order-on-frontier-ai-cybersecurity"}],
     zh:{t:"白宫前沿AI自愿框架：联邦机构须在今天（8月1日）前完成设计",
       what:"2026年6月2日行政令要求联邦机构在2026年8月1日前设计出一套自愿框架，供前沿模型开发者在发布前与政府对接。NSA与CISA负责建立保密的网络能力基准，达标模型被定为'covered frontier models'，开发者可自愿提供最多30天的发布前访问权。行政令明确不设强制许可或预审。",
       stage:"截止日到期（今日）——框架设计阶段结束，进入公布与实施",
       who:"OpenAI、Anthropic、Google、Meta、xAI等前沿开发者；联邦采购与国安机构；云厂商。",
       watch:"框架文本是否按期公布、'自愿'在采购与安全审查中是否变成事实门槛、以及哪些模型会被划入covered范围。"},
     en:{t:"White House voluntary frontier-AI framework: agencies must finish the design today, August 1",
       what:"The June 2, 2026 executive order directs federal agencies to design, by August 1, 2026, a voluntary framework for frontier model developers to engage with the government before release. NSA and CISA build a classified cyber-capability benchmark; models that clear it are designated 'covered frontier models,' and developers may voluntarily grant up to 30 days of pre-release access. The order explicitly creates no mandatory licensing or preclearance.",
       stage:"Deadline due (today) — design phase closes and moves to publication and implementation",
       who:"Frontier developers including OpenAI, Anthropic, Google, Meta and xAI; federal procurement and national security agencies; cloud providers.",
       watch:"Whether the text publishes on schedule, whether 'voluntary' becomes a de facto gate in procurement and security review, and which models fall inside the covered designation."}},
    {id:"pl2",cat:"policy",conf:"fact",time:"2026-07-31 · European Commission",
     src:[{n:"Associated Press (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"欧盟组建AI法案执法团队，AI办公室增编38人并开通保密举报渠道",
       what:"欧盟在布鲁塞尔成立专门执法团队，监督AI法案主要条款生效后的合规情况，覆盖欧洲初创公司与OpenAI、Anthropic、Google及在欧运营的中国AI公司。欧盟委员会向AI办公室增派38名工作人员，并推出合规与吹哨工具，允许匿名举报涉嫌违规。执法优先事项包括AI深度伪造、非法影像、自动化网络攻击、未标注合成内容，以及可能损害基本权利的系统。违规者可能面临罚款或在欧市场准入限制。",
       stage:"已生效并进入执法阶段（分条款推进）",
       who:"在欧提供或部署高级AI系统的所有厂商、平台的信任与安全团队、内容溯源与水印供应商、欧洲云与SaaS采购方。",
       watch:"首批立案对象与处罚力度、监管机构审计复杂模型的实际能力，以及'技术事故'与'安全失职'如何被区分。"},
     en:{t:"The EU formed an AI Act enforcement team, adding 38 staff to its AI Office and opening confidential reporting channels",
       what:"The EU created a dedicated enforcement team in Brussels to oversee compliance as major AI Act provisions take effect, covering European startups and global providers including OpenAI, Anthropic, Google and Chinese AI companies operating in the market. The Commission is adding 38 staff to its AI Office and introducing compliance and whistleblower tools for confidential reports. Enforcement priorities include AI deepfakes, illicit imagery, automated cyberattacks, failures to label synthetic content, and systems that could undermine fundamental rights. Violations can bring financial penalties or restrictions on offering products in the EU.",
       stage:"In effect and moving into enforcement (provisions phasing in)",
       who:"Every provider or deployer of advanced AI systems in Europe, platform trust and safety teams, provenance and watermarking vendors, European cloud and SaaS buyers.",
       watch:"The first cases and penalty levels, regulators' actual capacity to audit complex models, and how 'technical incident' gets distinguished from 'safety failure.'"}},
    {id:"pl3",cat:"policy",conf:"fact",time:"2026-07-31 · White House / USTR",
     src:[{n:"Trade Compliance Resource Hub",u:"https://www.tradecomplianceresourcehub.com/2026/07/27/trump-2-0-tariff-tracker/"},{n:"Tax Foundation",u:"https://taxfoundation.org/research/all/federal/trump-tariffs-trade-war/"}],
     zh:{t:"对墨西哥加税推迟90天；专利药100%第232条关税7月31日生效",
       what:"7月31日，特朗普宣布把对墨西哥的关税上调推迟90天，原定8月1日生效的30%对等关税因此暂缓。同日，针对总统公告Annex I所列专利药品及相关活性药物成分的100%第232条关税，对Annex III所列企业正式生效。此前7月23日USTR敲定了覆盖80余个贸易伙伴、税率10%–12.5%的强迫劳动相关第301条关税。这些措施是在2026年2月最高法院推翻IEEPA关税后，行政部门改用其他法律授权推进的结果。",
       stage:"墨西哥：推迟90天（暂缓）；专利药232条：已生效；301条：已敲定",
       who:"跨国制药与仿制药、美墨供应链（汽车、农产品、电子组装）、进口商与报关合规、医院与支付方的采购成本。",
       watch:"90天窗口内的美墨谈判议题、有多少药企通过最惠国价格协议换取豁免、以及301条关税的行业豁免申请节奏。"},
     en:{t:"The Mexico tariff increase was delayed 90 days; the 100% Section 232 tariff on patented drugs took effect July 31",
       what:"On July 31 Trump announced a 90-day delay to the tariff increase on Mexico, pausing the 30% reciprocal rate that had been set for August 1. The same day, a 100% Section 232 tariff took effect on patented pharmaceutical products and related active ingredients listed in Annex I of a presidential proclamation, for companies named in Annex III. Earlier, on July 23, USTR finalized forced-labor-related Section 301 tariffs of 10%–12.5% covering more than 80 trading partners. These follow the Supreme Court striking down IEEPA tariffs in February 2026, after which the administration moved to alternative legal authorities.",
       stage:"Mexico: delayed 90 days (paused). Pharma Section 232: in effect. Section 301: finalized",
       who:"Multinational pharma and generics, US–Mexico supply chains (autos, agriculture, electronics assembly), importers and customs compliance, hospital and payer procurement costs.",
       watch:"What gets negotiated in the 90-day window, how many drugmakers trade most-favored-nation pricing for relief, and the pace of Section 301 exclusion requests."}},
    {id:"pl4",cat:"policy",conf:"fact",time:"2026-07-31 · New York AG / CFTC",
     src:[{n:"Bloomberg Law (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"纽约州总检察长起诉预测市场Kalshi涉非法博彩，CFTC紧急动议反制",
       what:"纽约州总检察长Letitia James起诉预测市场平台Kalshi在该州经营非法博彩业务，要求停止提供部分事件合约，并可能按涉嫌违法交易笔数处以巨额罚款。Kalshi主张自己是受商品期货交易委员会（CFTC）监管的联邦衍生品交易所。CFTC随即提交紧急动议，试图阻止纽约州的执法行动，称此举侵入联邦管辖权。",
       stage:"诉讼进行中（联邦与州管辖权冲突）",
       who:"预测市场平台与其做市商、体育博彩运营商与州博彩监管、围绕选举与经济数据合约创业的风投项目、券商的事件合约产品线。",
       watch:"法院是否受理CFTC的优先适用主张、其他州是否跟进起诉、以及事件合约是否被最终归类为金融工具还是博彩产品。"},
     en:{t:"New York's attorney general sued prediction market Kalshi over illegal gambling; the CFTC moved to block the state",
       what:"New York Attorney General Letitia James sued prediction-market platform Kalshi for operating an illegal gambling business in the state, seeking to stop certain event contracts and exposing the company to penalties scaled to the number of allegedly unlawful transactions. Kalshi argues it is a federally regulated derivatives exchange under CFTC oversight. The CFTC filed an emergency motion to block New York's enforcement action, calling it an intrusion into federal authority.",
       stage:"Litigation ongoing (federal vs. state jurisdiction)",
       who:"Prediction-market platforms and their market makers, sportsbooks and state gaming regulators, venture-backed startups building election and economic-data contracts, brokerages with event-contract lines.",
       watch:"Whether courts accept the CFTC's preemption argument, whether other states follow with suits, and whether event contracts are ultimately classified as financial instruments or gambling."}},
    {id:"pl5",cat:"policy",conf:"report",time:"2026-07-31 · FCC (US)",
     src:[{n:"Business Insider (via Tech Startups)",u:"https://techstartups.com/2026/07/31/top-tech-news-today-july-31-2026-amazon-anthropic-apple-google-microsoft-reddit-sony-suno-more/"}],
     zh:{t:"美国限制中国先进机器人进口，本土机器人产业内部分裂",
       what:"美国联邦通信委员会（FCC）出台政策，限制部分中国产先进机器人设备进口，涵盖可能包括人形与四足机器人的类别，理由是配备摄像头、麦克风、无线系统与自主能力的联网机器存在国家安全与网络安全风险。大型美国机器人公司支持此举，认为可限制受补贴的中国竞争并强化本土制造；小型初创与高校研究者则警告，这会切断他们获取Unitree等厂商廉价硬件的渠道，而同类美国系统价格显著更高或尚无商业化规模供应。",
       stage:"已出台（产业反弹进行中）",
       who:"机器人初创与高校实验室、美国机器人制造商、具身智能与感知算法团队、工业自动化集成商。",
       watch:"是否出现研究用途豁免、本土低价开发平台的供给速度、以及初创是否转向模块化组件而非整机进口。"},
     en:{t:"A US restriction on advanced Chinese robot imports split the domestic robotics industry",
       what:"The Federal Communications Commission issued a policy restricting imports of certain advanced robotic devices from China, covering categories that can include humanoid and quadruped robots, citing national security and cybersecurity concerns about connected machines with cameras, microphones, wireless systems and autonomous capabilities. Large US robotics companies backed the move as a check on subsidized Chinese competition; smaller startups and university researchers warned it cuts off affordable hardware from makers such as Unitree, while comparable US systems cost far more or are not available at commercial scale.",
       stage:"Issued (industry pushback underway)",
       who:"Robotics startups and university labs, US robot manufacturers, embodied-AI and perception teams, industrial automation integrators.",
       watch:"Whether research exemptions appear, how fast affordable domestic development platforms arrive, and whether startups shift to modular components instead of complete imported robots."}},
    {id:"pl6",cat:"policy",conf:"report",time:"2026-06 → 08 · US Senate (管线/pipeline)",
     src:[{n:"Americans for Responsible Innovation",u:"https://ari.us/senate-ndaa-takes-major-step-to-strengthen-ai-chip-export-controls/"},{n:"The Hill",u:"https://thehill.com/policy/technology/5699863-congress-ai-overwatch-act-chips-export/"}],
     zh:{t:"（管线）三部AI芯片法案搭车国防授权法案：AI OVERWATCH、Chip Security、MATCH",
       what:"参议院国防授权法案（NDAA）的管理人修正案纳入三部AI芯片与半导体设备安全法案。AI OVERWATCH Act要求行政部门在向中国、俄罗斯、伊朗等国出口芯片前给国会审查机会；Chip Security Act要求企业追踪其境外AI芯片以打击走私；MATCH Act旨在推动盟友限制向中国出售半导体制造设备。参议院银行委员会此前也在讨论单独的出口管制立法markup。",
       stage:"委员会/院会审议（搭载NDAA）",
       who:"英伟达、AMD、应用材料、ASML等设备与芯片厂商；云厂商的海外部署；中国相关业务敞口较大的美股。",
       watch:"NDAA最终文本是否保留三法、追踪与报告义务的具体成本、以及企业合规是否会拖慢海外数据中心交付。"},
     en:{t:"(Pipeline) Three AI chip bills are riding the defense authorization act: AI OVERWATCH, Chip Security and MATCH",
       what:"The Senate NDAA manager's amendment includes three AI chip and semiconductor-equipment security bills. The AI OVERWATCH Act would give lawmakers a chance to review chip exports to countries such as China, Russia and Iran; the Chip Security Act would require companies to track their AI chips abroad to combat smuggling; the MATCH Act aims to push allies to restrict sales of semiconductor manufacturing equipment to China. The Senate Banking Committee has separately weighed a standalone export-control markup.",
       stage:"Committee / floor process (attached to the NDAA)",
       who:"Nvidia, AMD, Applied Materials, ASML and other chip and equipment makers; cloud providers' overseas deployments; US equities with large China exposure.",
       watch:"Whether all three survive the final NDAA text, the real cost of tracking and reporting obligations, and whether compliance slows overseas data-center delivery."}}
