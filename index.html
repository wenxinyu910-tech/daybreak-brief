    ai:[
      {id:"a1",cat:"ai",conf:"fact",time:"2026-08-13 · 据路透报道，北京与雷德蒙德",
       src:[{n:"Reuters",u:"https://www.reuters.com/world/china/microsoft-retreats-china-ai-boom-helps-it-keep-window-open-2026-08-13/"},{n:"Tech Startups",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"微软持续收缩在华实体存在，但用AI与云保留一扇窗",co:"Microsoft",
         what:"路透报道，在多年地缘紧张、监管收紧与技术出口管制后，微软已关闭或退出至少15家在华分支与合资机构，中国对其全球营收的贡献到2024年降至约1.5%。公司曾在2023年考虑更彻底的撤出，最终决定保留部分业务。留下来的部分越来越集中在AI、云服务与出海的中国企业客户；微软已把部分顶尖研究人员调离中国，并在境外建立替代研究中心。",
         impact:"这是受控敞口而非市场扩张的策略样本。对跨国科技公司而言，中国正从增长市场转为一个需要用最小实体足迹去服务的客户来源；对中国企业出海服务商与本土云厂商而言，微软的收缩既让出份额也抬高了合规门槛。"},
       en:{t:"Microsoft keeps shrinking its physical China footprint while using AI and cloud to keep a window open",co:"Microsoft",
         what:"Reuters reported that after years of geopolitical tension, tighter regulation and technology export controls, Microsoft has closed or withdrawn from at least 15 branches and joint ventures in China, with the country's share of worldwide revenue falling to about 1.5% by 2024. The company considered a fuller exit in 2023 before deciding to keep selected operations. What remains is increasingly tied to AI, cloud and Chinese companies expanding abroad; Microsoft has relocated some top researchers and built alternative research hubs outside China.",
         impact:"This is a template for controlled exposure rather than market expansion. For multinationals, China is shifting from a growth market to a customer source served with the smallest possible physical footprint; for domestic cloud vendors and China-outbound service providers, Microsoft's retreat both cedes share and raises the compliance bar."}},
      {id:"a2",cat:"leadership",conf:"report",time:"2026-08-13 · 据《华尔街日报》报道",
       src:[{n:"Tech Startups（引述WSJ）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"Hassabis推动设立独立AI安全监督机构，已与财长贝森特及白宫科技顾问接触",co:"Google DeepMind",
         what:"据《华尔街日报》报道，Google DeepMind负责人Demis Hassabis正在推动建立一个独立行业机构，用于制定通用的AI安全实践。他已就此与多家主要AI实验室高管以及美国官员沟通，包括财政部长Scott Bessent与白宫科技顾问Michael Kratsios。据报道他在概念上将该机构类比国际原子能机构，但也承认监督由竞争性私营公司开发的软件与核材料监管存在本质差异。",
         impact:"这条的价值在于位置：它试图在企业自愿承诺与政府正式监管之间插入一层技术性标准机构。可行性取决于竞争对手是否愿意接受可能影响发布节奏的外部约束——这正是过去所有自律尝试失败的地方。对企业AI采购方而言，若该机构成型，合规问卷与供应商评估标准会随之改写。"},
       en:{t:"Hassabis is pushing for an independent AI safety oversight body, having raised it with Treasury Secretary Bessent and the White House tech adviser",co:"Google DeepMind",
         what:"The Wall Street Journal reported that Google DeepMind's Demis Hassabis is promoting an independent industry body to establish common AI safety practices. He has raised the proposal with executives at major AI labs and with US officials including Treasury Secretary Scott Bessent and White House technology adviser Michael Kratsios. He has reportedly compared the concept to the International Atomic Energy Agency while acknowledging that overseeing software built by competing private companies differs fundamentally from nuclear materials oversight.",
         impact:"The value here is positional: it attempts to insert a technical standards layer between voluntary corporate commitments and formal government regulation. Feasibility depends on whether rivals will accept external constraints that could affect release timing — precisely where every prior self-regulation attempt has failed. If it forms, enterprise AI compliance questionnaires and vendor assessment criteria get rewritten around it."}},
      {id:"a3",cat:"ai",conf:"fact",time:"2026-08-12 · SpaceXAI（原 xAI）",
       src:[{n:"Tech Startups（引述SiliconANGLE）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"SpaceXAI发布Grok 4.6，主打长时程智能体与编码，输入定价每百万token 2美元",co:"SpaceXAI / xAI",
         what:"SpaceXAI（原xAI）于8月12日发布Grok 4.6，面向长时运行智能体、编码与多步交互任务优化。据报道其在Artificial Analysis智能指数上与GPT-5.6 Sol持平，在编码与知识基准上较Grok 4.5有提升。定价为每百万输入token 2美元、输出6美元，另有价格翻倍的高速版本。可通过Cursor、Grok Build、API及OpenRouter等合作方接入。",
         impact:"关键变量是价格，不是分数。当一个接近前沿的模型把输入定到每百万token 2美元，智能体应用的单位成本模型会被整体下修——这直接影响所有按调用量计费的AI产品的毛利假设。对OpenAI与Anthropic而言，这是在中高端市场的持续价格压力。"},
       en:{t:"SpaceXAI released Grok 4.6 for long-horizon agents and coding at $2 per million input tokens",co:"SpaceXAI / xAI",
         what:"SpaceXAI, formerly xAI, launched Grok 4.6 on August 12, optimized for long-running agents, coding and multi-step interactive tasks. It reportedly matches GPT-5.6 Sol on the Artificial Analysis Intelligence Index with gains over Grok 4.5 on coding and knowledge benchmarks. Pricing is $2 per million input tokens and $6 per million output, with a faster variant at double the cost. Access runs through Cursor, Grok Build, the API and partners including OpenRouter.",
         impact:"The variable that matters is price, not score. When a near-frontier model prices input at $2 per million tokens, the unit-cost model for agentic applications resets downward across the board, which directly changes gross-margin assumptions for every usage-billed AI product. For OpenAI and Anthropic it is sustained price pressure in the mid-to-high tier."}},
      {id:"a4",cat:"ai",conf:"fact",time:"2026-08-13 · 联想财报，香港",
       src:[{n:"Tech Startups（引述联想IR）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"联想季度营收创纪录269亿美元、同比增43%，AI相关收入增约60%",co:"Lenovo 联想",
         what:"联想公布史上最强第一财季，营收达269亿美元，同比增长43%，各主要业务集团营收与经营利润均创同期新高。AI相关产品与服务收入同比增长约60%，AI业务约占总收入的35%。当日惠普与戴尔股价分别上涨约3.6%与2.9%，部分受联想业绩超预期带动。",
         impact:"这是AI支出正在向PC、服务器与企业硬件扩散的直接证据，而不只是集中在英伟达GPU与超大规模数据中心。对渠道与OEM而言，AI PC的换机周期开始产生实际收入；但需要观察这是一次性升级潮还是可持续需求——首轮升级完成后的复购率才是真正的检验。"},
       en:{t:"Lenovo posted a record $26.9 billion quarter, up 43% year over year, with AI-related revenue up about 60%",co:"Lenovo",
         what:"Lenovo reported its strongest first fiscal quarter on record at $26.9 billion in revenue, up 43% year over year, with all major business groups setting first-quarter highs for both revenue and operating profit. Revenue tied to AI products and services rose roughly 60% and AI now accounts for about 35% of total revenue. HP and Dell rose about 3.6% and 2.9% the same day, partly on the read-through.",
         impact:"This is direct evidence that AI spending is spreading into PCs, servers and enterprise hardware rather than staying concentrated in Nvidia GPUs and hyperscale data centers. For channel partners and OEMs the AI PC refresh cycle is generating real revenue; the open question is whether this is a one-off upgrade wave or durable demand, and repeat purchase rates after the first cycle are the real test."}},
      {id:"a5",cat:"ai",conf:"fact",time:"2026-08-13 · 印度金奈，L&T 公告",
       src:[{n:"Tech Startups（引述《经济时报》）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"L&T拿下最高约15.7亿美元AI基建订单，为Together AI在金奈部署约1万张英伟达B300",co:"Larsen & Toubro / Together AI / NVIDIA",
         what:"印度工程集团Larsen & Toubro获得一份价值约1,000亿至1,500亿卢比（最高约15.7亿美元）的AI基础设施合同，用于美国AI公司Together AI的大规模部署。项目将在L&T金奈数据中心园区部署约10,000张英伟达B300 GPU，被定位为印度最大的单集群AI计算装置。",
         impact:"印度长期是云服务的大买家但不是前沿算力的所在地，这个集群改变的是位置而非规模——本地训练与推理容量决定了印度创业公司与研究机构能否在不出境的前提下做前沿工作。对英伟达而言，这说明新一代加速器的需求正在超出美国超大规模厂商的范围。"},
       en:{t:"L&T won an AI infrastructure order worth up to about $1.57 billion to deploy roughly 10,000 Nvidia B300s for Together AI in Chennai",co:"Larsen & Toubro / Together AI / NVIDIA",
         what:"Indian engineering conglomerate Larsen & Toubro secured an AI infrastructure contract valued at roughly 100 to 150 billion rupees, as much as about $1.57 billion, tied to a large deployment for US-based Together AI. The project puts around 10,000 Nvidia B300 GPUs at L&T's Chennai data center campus and is being positioned as India's largest single-cluster AI computing installation.",
         impact:"India has long been a large buyer of cloud services without hosting frontier compute, and what this cluster changes is location rather than scale — local training and inference capacity determines whether Indian startups and research institutions can do frontier work without sending data abroad. For Nvidia it shows demand for the newest accelerator generation extending well beyond US hyperscalers."}}

       zh:{t:"数据中心运营商Vantage权衡估值约1,000亿美元的IPO",does:"超大规模数据中心开发与运营，参与OpenAI与甲骨文Stargate相关的威斯康星园区",amt:"IPO或融资约100亿美元，对应估值约1,000亿美元；出售亦在选项中",inv:"现有股东为Silver Lake与DigitalBridge；2023年底以来已募集约110亿美元",
         why:"如果成行，这将是数据中心不再是房地产、而是技术基础设施这个论点的第一个公开市场定价基准。1,000亿美元估值意味着投资人按AI需求而非租金现金流给资产定价，这会重估整个数据中心REIT板块。目前仍处早期讨论阶段，交易最早可能在明年发生。"},
       en:{t:"Data center operator Vantage is weighing an IPO at roughly a $100 billion valuation",does:"Hyperscale data center development and operations, including a Wisconsin campus tied to the OpenAI-Oracle Stargate buildout",amt:"An IPO or raise around $10 billion implying about $100 billion of value; a sale is also among the options",inv:"Backed by Silver Lake and DigitalBridge; roughly $11 billion raised since late 2023",
         why:"If it happens, this becomes the first public-market benchmark for the thesis that data centers are technology infrastructure rather than real estate. A $100 billion mark means investors price the asset off AI demand rather than rent cash flows, which would reprice the entire data center REIT complex. Discussions remain preliminary and any transaction could come as soon as next year."}},
      {id:"s2",cat:"startups",conf:"report",time:"2026-08-13 · AI编码工具 (Bloomberg)",
       src:[{n:"Tech Startups（引述彭博）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"Cognition洽谈新一轮融资，估值至少400亿美元",does:"Devin编码智能体与自主软件工程系统",amt:"早期讨论阶段，估值至少400亿美元，较近期水平上升逾50%",inv:"投资方未披露",
         why:"报道称公司年化收入接近10亿美元。400亿美元估值对应约40倍年化收入，定价的是编码智能体能吃掉企业每年数千亿美元软件工程支出中一块的假设。风险在于赛道极度拥挤——模型厂商、IDE集成、命令行工具、自主工程系统同时竞争，护城河尚未被验证。讨论仍属初步，条款可能变化或交易不成。"},
       en:{t:"Cognition is discussing a new round at a valuation of at least $40 billion",does:"The Devin coding agent and autonomous software engineering systems",amt:"Early-stage discussions at $40 billion or more, over 50% above its recent level",inv:"Investors not disclosed",
         why:"The company reportedly approaches a $1 billion annualized revenue run rate. A $40 billion valuation is roughly 40 times annualized revenue and prices the assumption that coding agents capture a meaningful slice of the hundreds of billions enterprises spend on software engineering each year. The risk is an extremely crowded field — model providers, IDE integrations, CLI tools and autonomous engineering systems all competing — with the moat unproven. Talks are preliminary and terms could change or the deal may not happen."}},
      {id:"s3",cat:"startups",conf:"fact",time:"2026-08-13 · AI应用于传统行业 (TechCrunch)",
       src:[{n:"Tech Startups（引述TechCrunch）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"OpenAI投资的Thrive Holdings融资20亿美元，估值120亿美元",does:"收购并运营传统服务企业（会计、IT服务、合规等），用AI作为运营层重构交付方式",amt:"20亿美元，估值120亿美元",inv:"软银、D1 Capital Partners、Altimeter Capital参与",
         why:"这是AI投资的另一条分支：不做通用模型，而是买下劳动密集的服务生意，用AI把人力成本转成软件毛利。逻辑上很有吸引力——会计、IT服务、合规都是巨大且人力占比高的市场。难点全在执行：把AI嵌入既有工作流、客户关系与合规要求，比发布软件慢得多，也重得多。"},
       en:{t:"OpenAI-backed Thrive Holdings raised $2 billion at a $12 billion valuation",does:"Acquires and operates traditional service businesses — accounting, IT services, compliance — using AI as an operating layer to change how services are delivered",amt:"$2 billion at a $12 billion valuation",inv:"SoftBank, D1 Capital Partners and Altimeter Capital participating",
         why:"This is a different branch of the AI investment boom: instead of another general-purpose model, buy labor-intensive service businesses and convert headcount cost into software margin. The logic is attractive — accounting, IT services and compliance are enormous markets where labor dominates cost. The difficulty is entirely execution: embedding AI into existing workflows, customer relationships and compliance obligations is far slower and heavier than shipping software."}},
      {id:"s4",cat:"startups",conf:"report",time:"2026-08-13 · 法律AI (Financial Times)",
       src:[{n:"Tech Startups（引述FT）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"瑞典法律AI公司Legora寻求估值超100亿美元融资，四个月前还是56亿",does:"面向律师的AI软件，覆盖文档审阅、起草、尽职调查与合规",amt:"寻求新一轮融资，估值超过100亿美元",inv:"投资方未披露；客户包括Linklaters、德勤、喜力",
         why:"据报道其二季度年化经常性收入增长约50%至约1.5亿美元。同期竞争对手Harvey也被传以约150亿美元估值洽谈融资——法律AI正在从单一赢家变成一个有多个大玩家的市场。之所以能撑住这种倍数，是因为律所的支出结构里，研究、文档处理与合规的人力成本极高，AI节省的时间可以直接对应到企业预算而非消费订阅。"},
       en:{t:"Swedish legal AI company Legora is seeking funding above a $10 billion valuation, up from $5.6 billion four months ago",does:"AI software for lawyers covering document review, drafting, due diligence and regulatory work",amt:"A new round at more than $10 billion",inv:"Investors not disclosed; customers include Linklaters, Deloitte and Heineken",
         why:"Its annual recurring revenue reportedly rose about 50% to roughly $150 million in the second quarter. Rival Harvey has separately been linked to talks near a $15 billion valuation — legal AI is becoming a market with several large players rather than one winner. These multiples hold because law firm cost structure is dominated by human hours spent on research, document processing and compliance, so time saved maps directly onto enterprise budgets rather than consumer subscriptions."}}

    product:[
      {id:"p1",cat:"product",conf:"report",time:"2026-08-13 · Hacker News",
       src:[{n:"Developers Digest",u:"https://www.developersdigest.tech/blog/what-hacker-news-gets-right-about-ai-coding-agents-2026"},{n:"Hacker News front",u:"https://news.ycombinator.com/front"},{n:"Daily AI Dispatch",u:"https://buttondown.com/waynehead99/archive/daily-ai-dispatch-august-13-2026/"}],
       zh:{t:"开发者社区的争论从AI能不能写代码转向AI写的代码谁来维护",
         disc:"一篇关于AI编码工具的文章在Hacker News引发大规模讨论，核心论点是：AI编码工具移除了软件变更的速度限制，在缺乏强工程文化的团队里，最直接的后果是产生大量看起来能跑、但实质上摧毁可维护性的巨型PR。讨论中反复出现的关联主题包括技能退化（开发者是否还能脱离AI编程）与认知负荷（配置环境、管理基础设施、纠正AI幻觉的时间开始超过真正做产品的时间）。同期还有对编码智能体每月100–200美元订阅定价可持续性的质疑。",
         pain:"代码产出速度提升但评审能力没有同步提升，形成更多代码、更少理解的缺口；团队缺少衡量AI生成代码质量的标准；订阅定价与实际产出价值之间的关系尚未被验证。",
         who:"工程负责人与平台团队（需要重建代码评审与合规门禁）；AI编码工具厂商（Cursor、Cognition、GitHub）的留存与定价；以及正在把AI编码写进开发流程标准的企业。",
         opp:"最明显的空白是AI生成代码的质量治理层——PR体量控制、变更影响分析、自动化的可维护性评分，以及把智能体产出接入既有CI/CD与审计链路。当前工具解决的是生成，几乎没有工具解决验证与问责。（注：本条为多来源社区观察，尚不构成经量化确认的趋势）"},
       en:{t:"Developer debate has shifted from whether AI can write code to who maintains what it writes",
         disc:"An essay on AI coding tools drove a large Hacker News thread arguing that these tools remove the speed limit on software change, and that in teams without a strong engineering culture the immediate consequence is enormous pull requests that appear functional while quietly destroying maintainability. Recurring adjacent themes in the discussion included skill erosion — whether developers can still program without AI — and cognitive load, where time spent configuring environments, managing infrastructure and correcting AI hallucinations begins to exceed time spent on product work. Skepticism about the sustainability of $100-$200 monthly coding-agent subscriptions ran alongside it.",
         pain:"Code output speed rose without a matching rise in review capacity, producing a more-code-less-understanding gap; teams lack standards for measuring the quality of AI-generated code; and the relationship between subscription pricing and delivered value remains unproven.",
         who:"Engineering leaders and platform teams that must rebuild code review and compliance gates; retention and pricing at AI coding vendors including Cursor, Cognition and GitHub; and enterprises writing AI coding into their standard development process.",
         opp:"The clearest gap is a quality-governance layer for AI-generated code — PR size control, change-impact analysis, automated maintainability scoring, and wiring agent output into existing CI/CD and audit trails. Current tools solve generation; almost nothing solves verification and accountability. Note: this is a multi-source community observation, not a quantitatively confirmed trend."}},
      {id:"p2",cat:"product",conf:"fact",time:"2026-08-12 至 08-13 · 消费与企业软件",
       src:[{n:"Tech Startups",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"},{n:"Techmeme River",u:"https://www.techmeme.com/river"}],
       zh:{t:"Pixel 11把主动式AI当作换机理由，微软把消费版与商用版Copilot合并为一个应用",
         disc:"Google于8月12日发布Pixel 11、11 Pro与11 Pro XL，搭载Tensor G6芯片，起售价899美元（256GB起步），承诺七年软件支持，8月20日上市。卖点集中在主动式Gemini功能与端侧AI处理（如手语转文字、Magic Capture选帧）。同期微软正在把消费版与商用版Copilot应用合并为单一应用，移动端与网页端8月中旬推送，桌面端9月中旬。",
         pain:"消费者已经不再为摄像头参数换机，而AI功能是否值得换机尚未被证明；企业侧用户长期困扰于同一品牌下多个功能不一致的AI助手入口，身份切换与数据边界混乱。",
         who:"安卓旗舰竞争格局（三星与中国厂商）；基于Gemini API构建的开发者；微软365的部署管理员与合规团队；以及所有把AI功能写进产品路线图、但没想清楚它如何改变用户日常行为的产品经理。",
         opp:"两条都指向同一件事：AI正在从功能列表里的一项变成入口的组织方式。真正的机会不在于再加一个AI按钮，而在于重新设计信息与任务如何被主动送到用户面前——以及在企业环境里，如何在一个入口下正确处理个人与工作两套数据边界。"},
       en:{t:"Pixel 11 makes proactive AI the reason to upgrade, and Microsoft is merging consumer and commercial Copilot into one app",
         disc:"Google launched the Pixel 11, 11 Pro and 11 Pro XL on August 12 with the Tensor G6 chip, starting at $899 with 256GB, seven years of software support and availability on August 20. The pitch centers on proactive Gemini features and on-device AI processing such as sign-language-to-text and Magic Capture frame selection. Separately, Microsoft is merging its consumer and commercial Copilot apps into a single app, rolling out on mobile and web in mid-August and desktop in mid-September.",
         pain:"Consumers no longer upgrade for camera specs, and whether AI features justify an upgrade is unproven; on the enterprise side, users have long struggled with multiple inconsistent AI assistant entry points under one brand, with confused identity switching and data boundaries.",
         who:"The Android flagship contest against Samsung and Chinese vendors; developers building on Gemini APIs; Microsoft 365 deployment admins and compliance teams; and any product manager who has put AI features on a roadmap without deciding how they change daily user behavior.",
         opp:"Both point at the same thing: AI is moving from an item in a feature list to the organizing principle of the entry point. The real opportunity is not another AI button but redesigning how information and tasks are proactively surfaced — and, in enterprise settings, how one entry point correctly handles two separate personal and work data boundaries."}},
      {id:"p3",cat:"product",conf:"fact",time:"2026-08-13 · 物流与供应链安全",
       src:[{n:"Tech Startups（引述TNW与SecurityWeek）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{t:"物流平台成为攻击焦点：Uber Freight调查泄露声明，CEVA八个欧洲仓库仍在恢复",
         disc:"Uber Freight正在调查一起网络安全事件，一个黑客组织声称获取约100万份文件。公司称事件已被识别、隔离并修复，货运业务安全且正常运行，并已联系联邦执法部门；黑客的说法尚未被证实。谷歌研究人员将该组织与代号UNC6671的团伙关联，其手法包括语音钓鱼等社会工程。另一起事件中，CEVA Logistics在7月29日遭攻击后，仍在恢复欧洲八个仓库的系统，部分设施一度无法发出库存货物，受影响客户包括Bol、De Bijenkorf、ING、Ace & Tate等；CEVA警告部分个人信息（姓名、地址、邮箱、电话、订单信息）可能受影响。",
         pain:"物流平台横跨承运方、货主、仓库与企业客户，一次入侵的数据与运营外溢范围远超单一公司；企业普遍缺乏对第三方物流IT系统的可见性与替代方案。",
         who:"依赖第三方物流与货运平台的零售、电商与制造企业；供应链风险与保险；网络安全采购（尤其是身份验证与语音钓鱼防护）；以及企业的业务连续性预案。",
         opp:"两起事件暴露的共同缺口是：企业知道自己的仓库在哪，但不知道自己的仓库软件在谁手上。针对第三方物流IT依赖的映射、监控与切换预案，是一个尚未被产品化的真实需求。"},
       en:{t:"Logistics platforms are now the target: Uber Freight is investigating a leak claim while CEVA is still restoring eight European warehouses",
         disc:"Uber Freight is investigating a cybersecurity incident after a hacking group claimed roughly one million files. The company says the incident was identified, contained and remediated, that freight operations remain secure and fully operational, and that it has contacted federal law enforcement; the hackers' claims are unverified. Google researchers have linked the group to a cluster tracked as UNC6671, which uses voice phishing and other social engineering. Separately, CEVA Logistics is still restoring systems at eight European warehouses after a July 29 attack, with some facilities unable to ship stored goods; affected customers reportedly include Bol, De Bijenkorf, ING and Ace & Tate. CEVA warned that some personal data — names, addresses, emails, phone numbers and order information — may have been affected.",
         pain:"Logistics platforms sit across carriers, shippers, warehouses and corporate customers, so a single intrusion spills data and operational impact far beyond one company; most enterprises lack visibility into third-party logistics IT and have no fallback.",
         who:"Retail, e-commerce and manufacturing firms dependent on third-party logistics and freight platforms; supply chain risk and insurance; security procurement, particularly identity verification and vishing defense; and corporate business continuity planning.",
         opp:"The shared gap both incidents expose is that companies know where their warehouses are but not whose software runs them. Mapping, monitoring and failover planning for third-party logistics IT dependencies is real demand that has not yet been productized."}}

    policy:[
      {id:"pl1",cat:"policy",conf:"fact",time:"2026-08-13 · 美国劳工统计局 (BLS)",
       src:[{n:"BLS",u:"https://www.bls.gov/news.release/archives/ppi_08132026.htm"}],
       zh:{t:"7月PPI发布：标题持平、核心+0.4%，重塑9月FOMC的默认路径",
         what:"劳工统计局按期发布7月生产者价格指数。最终需求环比持平、同比+4.7%；剔除食品、能源与贸易服务的核心分项环比+0.4%。数据发布后，路透引述CME FedWatch称交易员对美联储9月按兵不动的定价回到约63%。联邦基金目标区间目前为3.50%–3.75%（有效利率3.63%）。",
         stage:"已生效（数据已发布，构成政策输入）",
         who:"利率敏感的所有行业；债券与股票久期定价；出口商与进口商的成本传导测算；地方政府与企业的债务再融资计划。",
         watch:"8月26日PCE；9月FOMC（沃什主席此前设定的条件是通胀不降就加）；以及8月PPI中汽油分项是否回补。"},
       en:{t:"July PPI released: flat headline, core +0.4%, reshaping the default path into the September FOMC",
         what:"The Bureau of Labor Statistics published the July Producer Price Index on schedule. Final demand was unchanged month over month and up 4.7% year over year, while the core measure excluding foods, energy and trade services rose 0.4%. After the release, Reuters citing CME FedWatch put trader pricing for a September hold back near 63%. The federal funds target range currently stands at 3.50%-3.75% with an effective rate of 3.63%.",
         stage:"In effect — data published and now a policy input",
         who:"Every rate-sensitive sector; duration pricing across bonds and equities; cost pass-through modeling for importers and exporters; and refinancing plans at municipalities and corporates.",
         watch:"The August 26 PCE; the September FOMC, where Chair Warsh previously set the condition as hike-unless-inflation-falls; and whether the gasoline component reverses in the August PPI."}},
      {id:"pl2",cat:"policy",conf:"fact",time:"2026-08 · 美国财政部 OFAC 与白宫",
       src:[{n:"CNN 实时报道",u:"https://edition.cnn.com/2026/08/13/world/live-news/iran-war-trump"},{n:"TIME",u:"https://time.com/article/2026/08/10/iran-us-strait-of-hormuz-conditions-trump-negotiations/"}],
       zh:{t:"对伊制裁持续加码，美方对重开霍尔木兹的谈判姿态是半谈判",
         what:"美国财政部海外资产控制办公室（OFAC）持续对多国的个人、兑换机构与公司实施制裁，作为在伊朗恢复袭击霍尔木兹后加大经济施压的一部分。伊朗方面提出六项条件作为重开海峡的前提，包括解除制裁与战争赔偿。特朗普总统对Axios表示美方在低调处理、只是在半谈判，同时坚称海峡处于美方控制之下。海峡自2月底实质关闭，战事已进入第六个月。",
         stage:"已生效（制裁）／酝酿中（谈判）",
         who:"能源、航运、战争险保险、大宗商品贸易；与中东有敞口的银行合规部门；欧洲与亚洲的原油进口国；以及所有跨境支付与制裁筛查流程。",
         watch:"阿曼斡旋是否产生可执行文本；美方是否在封锁或制裁上给出可验证让步；OFAC后续指定名单；以及IEA月报中的库存覆盖天数。"},
       en:{t:"Iran sanctions keep tightening while Washington's posture on reopening Hormuz is semi-negotiation",
         what:"The Treasury Department's Office of Foreign Assets Control has continued designating individuals, exchange houses and companies across several countries as part of ramped-up economic pressure after Iran resumed attacks in the Strait of Hormuz. Iran has set six conditions for reopening the strait, including sanctions relief and war reparations. President Trump told Axios the US is low-keying it and only semi-negotiating, while maintaining the strait is under American control. The waterway has been effectively closed since late February and the conflict is in its sixth month.",
         stage:"In effect for sanctions; in the pipeline for negotiations",
         who:"Energy, shipping, war-risk insurance and commodity trading; bank compliance functions with Middle East exposure; European and Asian crude importers; and every cross-border payment and sanctions-screening workflow.",
         watch:"Whether Omani mediation produces enforceable text; whether Washington offers verifiable movement on the blockade or sanctions; subsequent OFAC designations; and forward-cover figures in the IEA monthly report."}},
      {id:"pl3",cat:"policy",conf:"fact",time:"2026-08-05 · 美国参议院商务委员会（背景）",
       src:[{n:"IAPP",u:"https://iapp.org/news/a/us-senate-committee-approves-kosa-children-s-ai-safety-bills"},{n:"Washington Times",u:"https://www.washingtontimes.com/news/2026/jul/23/senate-panel-take-kids-online-safety-ai-bills-early-august/"}],
       zh:{t:"（背景）参议院商务委员会通过KOSA与一揽子儿童AI安全法案，AI联邦优先条款仍在谈判",
         what:"美国参议院商务、科学与交通委员会于8月5日的委员会审议中表决通过了《儿童在线安全法案》（KOSA）以及多项涉及AI的儿童隐私法案，包括《青少年AI隐私法案》、CHAT Act与《儿童人工智能玩具安全法案》。在此次审议之前，布莱克本参议员一直在与白宫幕僚就一个立法包进行谈判，内容可能包括KOSA、《NO FAKES法案》、年龄验证要求以及AI联邦优先（preemption）条款。",
         stage:"委员会（已过委，尚未院会表决）",
         who:"面向未成年人的消费互联网与游戏平台；AI玩具与陪伴类产品；广告与数据经纪商；以及依赖各州AI法规差异做合规规划的企业——联邦优先条款若入法将彻底改变合规地图。",
         watch:"院会排期与是否被并入更大的立法包；AI联邦优先条款的最终措辞（这是科技行业与各州之间最实质的争点）；以及《NO FAKES法案》是否随行。"},
       en:{t:"Background: Senate Commerce advanced KOSA and a package of children's AI safety bills, with AI preemption still under negotiation",
         what:"The Senate Committee on Commerce, Science and Transportation voted in an August 5 markup to advance the Kids Online Safety Act along with several bills on children's privacy and artificial intelligence, including the Youth AI Privacy Act, the CHAT Act and the Children's Artificial Intelligence Toy Safety Act. Ahead of the markup, Senator Blackburn had been negotiating with White House aides over a legislative package that could include KOSA, the NO FAKES Act, age verification requirements and AI preemption language.",
         stage:"Committee — reported out, no floor vote yet",
         who:"Consumer internet and gaming platforms serving minors; AI toys and companion products; advertising and data brokers; and any company whose compliance planning depends on differences between state AI laws, since preemption would redraw the entire map.",
         watch:"Floor scheduling and whether it folds into a larger package; the final wording of AI preemption, the most substantive fight between the tech industry and the states; and whether the NO FAKES Act rides along."}},
      {id:"pl4",cat:"policy",conf:"fact",time:"2025-12 至 2026-01 · USTR 与 BIS（管线）",
       src:[{n:"CNBC",u:"https://www.cnbc.com/2025/12/23/us-china-chip-tariffs.html"},{n:"Gibson Dunn",u:"https://www.gibsondunn.com/trump-administration-new-tariffs-on-and-export-licensing-requirements-for-advanced-semiconductors-create-challenging-new-cross-currents-new-opportunities-for-us-manufacturers/"},{n:"Congress.gov CRS",u:"https://www.congress.gov/crs-product/LSB11409"}],
       zh:{t:"（管线）对华芯片关税定于2027年6月23日上调，先进计算芯片出口许可已改为逐案审查",
         what:"美国贸易代表办公室在调查后认定中国在半导体领域存在不公平贸易做法，但将新关税推迟：当前税率为零，将于2027年6月23日上调，具体税率将在生效前至少30天公布。另一条线上，商务部工业与安全局（BIS）已于2026年1月15日发布最终规则，把对中国与澳门出口特定先进计算集成电路的许可审查政策从推定拒绝改为逐案审查，但附带出口商证明要求。2026年1月14日的总统公告另对一类特定芯片的再出口加征25%关税。",

      {id:"v1",cat:"leadership",conf:"report",time:"2026-08-13 · 据《华尔街日报》报道",
       src:[{n:"Tech Startups（引述WSJ）",u:"https://techstartups.com/2026/08/13/top-tech-news-today-august-13-2026-anthropic-deepmind-google-lenovo-microsoft-spacexai-more/"}],
       zh:{name:"Demis Hassabis",role:"Google DeepMind 首席执行官",plat:"据《华尔街日报》报道",
         view:"主张建立一个独立的行业机构，为更强的人工智能系统制定共同的安全实践与护栏。据报道他在概念上类比国际原子能机构，但承认监督竞争性私营公司开发的软件与核材料监管存在本质差异。",
         bg:"Hassabis是DeepMind联合创始人，2024年因AlphaFold获诺贝尔化学奖。他已就该提议与多家主要AI实验室高管及美国官员沟通，包括财政部长Scott Bessent与白宫科技顾问Michael Kratsios。",
         note:"值得注意的是提议者的身份：由一家前沿实验室的负责人来推动外部约束，本身说明行业内部对只靠自律的信心已经不足。但真正的检验是竞争对手是否愿意接受可能拖慢发布节奏的规则——这是过去所有自律尝试的失败点。本条为转述报道，非直接引语。"},
       en:{name:"Demis Hassabis",role:"CEO, Google DeepMind",plat:"Reported by The Wall Street Journal",
         view:"He argues for an independent industry body to set common safety practices and guardrails for the development of more capable AI. He has reportedly compared the concept to the International Atomic Energy Agency while acknowledging that overseeing software built by competing private companies differs fundamentally from nuclear materials oversight.",
         bg:"Hassabis co-founded DeepMind and shared the 2024 Nobel Prize in Chemistry for AlphaFold. He has raised the proposal with executives at major AI labs and with US officials including Treasury Secretary Scott Bessent and White House technology adviser Michael Kratsios.",
         note:"Who is making the proposal is itself the signal: a frontier lab head pushing for external constraint suggests internal confidence in self-regulation alone has worn thin. The real test is whether rivals accept rules that could slow their release cadence — the failure point of every prior attempt. This is reported characterization, not a direct quote."}},
      {id:"v2",cat:"markets",conf:"fact",time:"2026-08-13 · 13F披露与公开评论",
       src:[{n:"CNBC",u:"https://www.cnbc.com/2026/08/13/ackman-buys-netflix-again-four-years-later-says-it-won-streaming-wars.html"},{n:"Motley Fool",u:"https://www.fool.com/investing/2026/08/13/bill-ackmans-pershing-square-just-bought-netflix-and-5-other-stocks-heres-what-investors-need-to-know/"}],
       zh:{name:"Bill Ackman",role:"Pershing Square Capital Management 创始人兼首席执行官",plat:"13F持仓披露与公开评论",
         view:"重新买入Netflix，认为它已经赢下流媒体大战。依据是经营利润率从2021年的21%升至约31.5%，而年度内容现金支出仅增长约2%——规模效应已经体现在利润结构而非收入增速上。",
         bg:"截至6月30日，Pershing Square持有315万股Netflix，约占组合4.9%。Ackman曾在2022年抛售期买入Netflix，数月后割肉，亏损超过4亿美元；此次买入发生在Netflix自2025年6月高点回落约50%之后。同期新建仓还包括Visa、Mastercard、标普全球、洲际交易所与Alcon。消息公布当日Netflix上涨约3.7%。",
         note:"新建仓的组合结构比单只股票更有信息量：Visa、Mastercard、标普全球、ICE都是收费型基础设施——拥有定价权、低资本开支、现金流稳定。这是在AI资本开支叙事主导市场时，明确选择了另一类资产。"},
       en:{name:"Bill Ackman",role:"Founder and CEO, Pershing Square Capital Management",plat:"13F disclosure and public comments",
         view:"He re-entered Netflix, saying it has effectively won the streaming wars. The basis: operating margin rose from 21% in 2021 to roughly 31.5% while annual cash content spending grew only about 2% — scale showing up in profit structure rather than revenue growth.",
         bg:"As of June 30, Pershing Square held 3.15 million Netflix shares, about 4.9% of the portfolio. Ackman bought Netflix during the 2022 selloff and sold months later at a loss exceeding $400 million; this purchase follows a roughly 50% decline from Netflix's June 2025 high. New positions disclosed alongside it include Visa, Mastercard, S&P Global, Intercontinental Exchange and Alcon. Netflix rose about 3.7% on the disclosure.",
         note:"The shape of the new-position list carries more information than any single name: Visa, Mastercard, S&P Global and ICE are all toll-style infrastructure — pricing power, low capex, steady cash flow. That is a deliberate move into a different asset class while the AI capex narrative dominates the market."}},
      {id:"v3",cat:"macro",conf:"report",time:"2026-08 · 美联储（背景）",
       src:[{n:"CNBC 7月FOMC",u:"https://www.cnbc.com/2026/07/29/fed-meeting-today-live-updates.html"},{n:"Charles Schwab",u:"https://www.schwab.com/learn/story/fomc-meeting"}],
       zh:{name:"Kevin Warsh",role:"美联储主席",plat:"7月FOMC后新闻发布会（背景）",
         view:"不把维持利率不变称为暂停，而是称之为对经济状况的严格审视。委员会以9比3投票维持联邦基金目标区间在3.50%–3.75%。",
         bg:"6月点阵图显示九位委员预计2026年至少加息一次，另有八位预计维持不变。当前有效联邦基金利率为3.63%。7月PPI公布后，市场对9月按兵不动的定价回到约63%。",
         note:"读这条要抓住一个反直觉的事实：当前政策风险的方向是加息而非降息，这与多数人对2026年的默认想象相反。核心PPI的0.4%正好落在这个不对称的敏感区间上——不足以触发加息，但足以让委员会保留选项。本条为公开报道转述。"},
       en:{name:"Kevin Warsh",role:"Chair, US Federal Reserve",plat:"Post-July FOMC press conference, background",
         view:"He declined to characterize holding rates steady as a pause, calling it instead a rigorous review of the economic situation. The committee voted 9-3 to keep the federal funds target range at 3.50%-3.75%.",
         bg:"The June dot plot showed nine members projecting at least one hike in 2026 with eight projecting no change. The effective federal funds rate is currently 3.63%. After the July PPI release, market pricing for a September hold returned to roughly 63%.",
         note:"The counterintuitive fact to hold onto: the direction of current policy risk is a hike, not a cut, which inverts most people's default picture of 2026. Core PPI at 0.4% lands precisely in that asymmetric sensitive zone — not enough to trigger a hike, but enough for the committee to keep the option. This is reported characterization of public remarks."}},

       en:{name:"Lenovo management",role:"Lenovo Group",plat:"Quarterly results",

    summary:{
      zh:`周一把上周五的叙事整个翻了过来。上周五非农减少2.3万，市场把它读成“美联储不必加息”，标普与纳指双创新高；<b>周一油价把这个前提拆了</b>——伊朗对重开霍尔木兹海峡加价（要求解除封锁、撤军、解冻资产、战争赔偿），<b>WTI跳涨约5%至82.13美元、布伦特约87.72美元</b>，十年期收益率升至约4.70%（月内最高），9月加息概率回到约<b>56.7%</b>。股指仅小幅回落（标普-0.06%、纳指-0.32%），但这是观望，不是分歧已解。第二条线是AI基建的钱从哪来：<b>Anthropic与比特币矿企Riot签下91亿美元、20年、191兆瓦算力协议</b>（三个月内第三笔，累计超600亿美元），<b>英特尔1971年上市以来首次公开增发</b>（150亿起、后上调至200亿/每股95美元），<b>OpenAI以8520亿美元平价回购70亿美元员工股</b>，而英伟达因传出与阿波罗、黑石筹划5000亿美元AI基建融资包而跌约3%——“循环融资”重新成为估值折价项。周三CPI是本周唯一的裁决者。`,
      en:`Monday inverted Friday's story. Friday's payrolls fell 23,000, the market read it as the Fed not having to hike, and the S&P and Nasdaq closed at records. <b>Monday, oil dismantled that premise</b>: Iran raised its price for reopening the Strait of Hormuz — lift the naval blockade, withdraw forces, unfreeze assets, pay war damages — and <b>WTI jumped about 5% to $82.13 with Brent near $87.72</b>. The 10-year yield rose to roughly 4.70%, its highest this month, and September hike odds climbed back to about <b>56.7%</b>. Indices barely moved (S&P -0.06%, Nasdaq -0.32%), but that is waiting, not resolution. The second thread is who funds the AI buildout: <b>Anthropic signed a $9.1 billion, 20-year, 191-megawatt compute deal with bitcoin miner Riot Platforms</b> — its third in three months, over $60 billion committed; <b>Intel launched its first public share sale since its 1971 listing</b> ($15 billion, upsized to $20 billion at $95); <b>OpenAI bought back $7 billion of employee stock at a flat $852 billion</b>; and Nvidia fell about 3% on a reported $500 billion AI-infrastructure financing package with Apollo and Blackstone. Circular financing is a valuation discount again. Wednesday's CPI is the week's only arbiter.`
    },
    top5:[
      {id:"t1",cat:"macro",conf:"fact",time:"2026-08-10 · 全球原油与美债市场 (ET)",
       src:[{n:"CNBC",u:"https://www.cnbc.com/2026/08/10/oil-prices-today-brent-wti-hormuz-trump-iran.html"},{n:"Al Jazeera",u:"https://www.aljazeera.com/economy/2026/8/10/oil-prices-climb-as-iranian-demands-cloud-outlook-for-strait-of-hormuz"},{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-09/latest-oil-market-news-and-analysis-for-aug-10"}],
       zh:{t:"伊朗为重开霍尔木兹海峡加价，WTI跳涨约5%至82.13美元，十年期收益率升至约4.70%",
         what:"伊朗周日称与阿曼就霍尔木兹通行的协议已进入最后阶段，但周一其政治顾问列出的条件明显抬高：美国须解除对伊朗港口的海上封锁、撤走部署在伊朗周边的军事力量、解除制裁、解冻被冻结资产并赔偿战争损失，同时停止针对伊朗及其地区盟友的军事行动。协议未能宣布，双方立场反而更硬。WTI原油上涨约5%至每桶82.13美元，布伦特约87.72美元；美国十年期国债收益率升至约4.70%，为本月最高、接近1月以来高位，两年期升至4.24%。",
         why:"这是一次典型的供给侧通胀冲击叠加在一份已经很脆弱的政策预期上。上周五非农转负本应压低加息概率，但油价通过运输与生产成本直接进入CPI与通胀预期，把“美联储不必加息”的定价基础抽走。结果是市场同时面对就业收缩与能源涨价——滞胀式组合，而不是软着陆。",
         who:"航空、物流、化工、包装消费品等能源成本占比高的行业首当其冲；炼油与上游能源股受益；利率久期最长的成长股与小盘股承压；所有把2026下半年输入成本假设建立在低油价上的公司需要重做预算。",
         watch:"阿曼斡旋是否在本周产生实质文本；美国是否在封锁与制裁上给出可验证的让步；以及油价上行能否在周三CPI的能源分项中体现——7月CPI覆盖期在油价跳涨之前，真正的传导要到8月数据。"},
       en:{t:"Iran raised its price for reopening the Strait of Hormuz; WTI jumped about 5% to $82.13 and the 10-year yield rose to roughly 4.70%",
         what:"Iran said Sunday that an accord with Oman on Hormuz transit was in its final stages, but on Monday its political adviser listed sharply higher conditions: the US must lift the naval blockade on Iranian ports, withdraw forces deployed around Iran, lift sanctions, unfreeze frozen assets, compensate for war damages, and halt military operations against Iran and its regional allies. No deal was announced and both positions hardened. WTI crude rose about 5% to $82.13 a barrel and Brent settled near $87.72. The US 10-year Treasury yield climbed to roughly 4.70%, its highest this month and near January levels, with the 2-year at 4.24%.",
         why:"This is a textbook supply-side inflation shock landing on an already fragile policy expectation. Friday's negative payroll print should have suppressed hike odds, but oil feeds directly into CPI and inflation expectations through transport and production costs, removing the premise underneath no-hike pricing. Markets now face contracting employment and rising energy at once — a stagflationary mix, not a soft landing.",
         who:"Energy-intensive sectors first: airlines, logistics, chemicals, packaged consumer goods. Refiners and upstream energy benefit. Long-duration growth and small caps come under pressure, and any company that built second-half 2026 input-cost assumptions on cheap oil needs to rebuild its budget.",
         watch:"Whether Omani mediation produces actual text this week; whether Washington offers verifiable movement on the blockade or sanctions; and whether the oil move shows up in Wednesday's CPI energy component — July CPI predates the spike, so real pass-through lands in the August data."}},
      {id:"t2",cat:"ai",conf:"fact",time:"2026-08-10 · 盘后公布，德州 Rockdale (ET)",
       src:[{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-11/anthropic-strikes-9-billion-deal-with-cloud-computing-firm-riot"},{n:"The Block",u:"https://www.theblock.co/news/business/2026-08-10-riot-platforms-ai-deal-anthropic-411358"},{n:"Yahoo Finance",u:"https://finance.yahoo.com/technology/ai/articles/anthropic-signs-9-1-billion-113731732.html"}],
       zh:{t:"Anthropic与比特币矿企Riot签下91亿美元、20年、191兆瓦算力协议，Riot盘后涨逾25%",
         what:"Anthropic与Riot Platforms达成协议，由后者在德州Rockdale园区提供191兆瓦数据中心与电力基础设施，用于Anthropic模型的训练与部署。合同为期20年，总额91亿美元，分阶段交付：首批96兆瓦目标为2027年12月，全部191兆瓦为2028年6月；另含两个五年延期选项，全部行使后总值可达161亿美元。Riot在纳斯达克的股价盘后一度上涨超过25%。这是Anthropic三个月内第三笔重大算力采购，累计承诺超过600亿美元。",
         why:"两件事同时发生。一是前沿实验室已经不再只买云服务，而是直接锁定电力与场地——真正的稀缺资源从GPU转向了并网容量与工期。二是比特币矿企正在完成向AI数据中心的转型：它们手里有电力合同、变电设施和可改造机房，这些资产在AI周期里的估值倍数远高于挖矿。2027年底才交付首批容量，也说明供给紧张要持续多久。",
         who:"Riot、Core Scientific、TeraWulf、Cipher等具备并网电力的矿企与HPC托管商；德州ERCOT电网与电价；传统超大规模云厂商（议价能力被稀释）；以及所有依赖2027–2028年算力可得性的AI产品路线图。",
         watch:"是否披露电价条款与Anthropic的付款结构（预付比例决定Riot的资本开支能力）；ERCOT对191兆瓦增量负荷的接入批复；以及其他实验室是否跟进锁定矿企容量。"},
       en:{t:"Anthropic signed a $9.1 billion, 20-year, 191-megawatt compute deal with bitcoin miner Riot Platforms; Riot rose over 25% after hours",
         what:"Anthropic struck an agreement under which Riot Platforms will supply 191 megawatts of data center and power infrastructure from its Rockdale, Texas campus to train and deploy Anthropic's models. The 20-year contract is worth $9.1 billion with phased delivery: the first 96 megawatts targeted for December 2027 and the full 191 megawatts by June 2028. Two five-year extension options could lift total value to $16.1 billion if fully exercised. Riot's Nasdaq-listed shares jumped more than 25% in after-hours trading. This is Anthropic's third major compute procurement in three months, totaling over $60 billion in commitments.",
         why:"Two things are happening at once. Frontier labs no longer just buy cloud — they lock up power and sites directly, because the binding constraint has shifted from GPUs to interconnect capacity and construction timelines. And bitcoin miners are completing their pivot to AI data centers: they hold power contracts, substations and convertible shells that carry far higher multiples in an AI cycle than in mining. That first tranche does not land until late 2027, which tells you how long the squeeze runs.",
         who:"Miners and HPC hosts with grid power — Riot, Core Scientific, TeraWulf, Cipher; the Texas ERCOT grid and power pricing; incumbent hyperscalers whose pricing power is diluted; and every AI product roadmap that assumes compute availability in 2027-2028.",
         watch:"Whether power-price terms and Anthropic's payment structure are disclosed — prepayment share determines Riot's capex capacity; ERCOT interconnection approval for 191 megawatts of new load; and whether rival labs move to lock up miner capacity too."}},
      {id:"t3",cat:"markets",conf:"fact",time:"2026-08-10 · 美股盘前公告 (ET)",
       src:[{n:"Intel Newsroom",u:"https://newsroom.intel.com/corporate/intel-announces-proposed-15-billion-common-stock-offering"},{n:"CNBC",u:"https://www.cnbc.com/2026/08/10/intel-intc-stock-offering-ai.html"},{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-10/intel-selling-15-billion-in-common-stock-to-fund-growth"}],
       zh:{t:"英特尔启动1971年上市以来首次公开增发，150亿美元起、后上调至200亿/每股95美元，股价跌约4%",
         what:"英特尔周一盘前宣布拟增发150亿美元普通股，并给予承销商30天内额外认购最多22.5亿美元的选择权，用途为一般公司用途，可能包括资本开支与营运资金。据CNBC报道，该发行随后上调至200亿美元、定价每股95美元。这是英特尔自1971年上市以来的首次公开股票发行。背景是二季度营收同比增长25%至161亿美元，为15年以来最强增速，数据中心与AI分部营收同比增长59%。以约5000亿美元市值计，增发对现有股东的稀释约为3%，当日股价下跌约4%。",
         why:"英特尔正在用股权而不是债务为AI产能扩张融资，这与它资产负债表的历史包袱一致，但也说明代工与先进封装的资本开支强度已经超出经营现金流的覆盖能力。市场当天用4%的跌幅回答了“稀释3%值不值”——在AI资本开支普遍被质疑的一周里，增发被读成资金需求信号而非增长信号。",
         who:"英特尔股东与可转债持有人；台积电与三星（代工份额竞争）；半导体设备商（应用材料、泛林、ASML的订单前景）；以及所有在评估“美国本土先进制程”供应方案的AI芯片客户。",
         watch:"最终定价与超额配售是否全额行使；募集资金在晶圆厂、先进封装与产品线之间的分配披露；以及下一季度资本开支指引是否上调——若上调，说明这轮增发只是开始。"},
       en:{t:"Intel launched its first public share sale since its 1971 listing — $15 billion, upsized to $20 billion at $95 — and the stock fell about 4%",
         what:"Intel announced before Monday's open a proposed $15 billion common stock offering with a 30-day underwriter option for up to $2.25 billion more, earmarked for general corporate purposes including capital expenditures and working capital. CNBC reported the deal was subsequently upsized to $20 billion priced at $95 per share. It is Intel's first public equity offering since the company listed in 1971. The backdrop: second-quarter revenue rose 25% year over year to $16.1 billion, its strongest growth in more than 15 years, with the data center and AI segment up 59%. Against a market value near $500 billion the raise dilutes existing holders by roughly 3%; the stock fell about 4% on the day.",
         why:"Intel is funding AI capacity expansion with equity rather than debt, consistent with its balance-sheet history but also a signal that foundry and advanced-packaging capex intensity now exceeds operating cash flow. The market answered the is-3%-dilution-worth-it question with a 4% decline: in a week when AI capex is broadly under suspicion, an equity raise reads as a funding-need signal rather than a growth signal.",
         who:"Intel shareholders and convertible holders; TSMC and Samsung on foundry share; semiconductor equipment vendors including Applied Materials, Lam and ASML on order outlook; and any AI chip customer evaluating US-domiciled advanced-node supply.",
         watch:"Final pricing and whether the greenshoe is fully exercised; disclosure of how proceeds split between fabs, advanced packaging and product lines; and whether next quarter's capex guidance moves up — if it does, this raise is only the first."}},
      {id:"t4",cat:"markets",conf:"report",time:"2026-08-10 · 美股交易时段 (ET)",
       src:[{n:"Alain Guillot Market Recap",u:"https://www.alainguillot.com/stock-market-recap-august-10-2026/"},{n:"FX Leaders",u:"https://www.fxleaders.com/news/2026/08/10/nvidia-stock-dives-as-more-spending-and-msft-chip-competition-weigh-on-nvda-while-financial-firms-partner-with-nvidia-for-funding/"},{n:"CNBC",u:"https://www.cnbc.com/2026/08/09/stock-market-today-live-updates.html"}],
       zh:{t:"英伟达跌约3%：传与阿波罗、黑石筹划5000亿美元AI基建融资包，“循环融资”重新成为折价项",
         what:"有报道称英伟达正与阿波罗全球管理（Apollo Global）及黑石（Blackstone）合作，筹划规模约5000亿美元的AI基础设施融资方案。消息当日英伟达股价下跌约3%，带动芯片板块走低，英特尔跌约4%。市场同时在消化微软自研Maia 300推理芯片对英伟达份额的潜在侵蚀。此前已有分析指出AI产业内部存在相互投资的循环结构（例如英伟达对OpenAI的投资，而OpenAI又采购英伟达芯片）。请注意：5000亿美元融资包目前为媒体报道，英伟达未作公开确认。",
         why:"关键不是金额，而是资金结构的性质发生了变化。当芯片供应商需要通过私募信贷与另类资产管理人来为自己的客户安排融资时，需求的可持续性就不再是一个纯粹的终端市场问题，而变成了信用问题。这正是2026年AI交易最脆弱的地方：收入增长真实，但越来越多的收入由供应商参与安排的资金支付。",
         who:"英伟达与整个AI硬件链；阿波罗、黑石等私募信贷与基础设施基金（新的费用池）；数据中心REIT与电力资产；以及持有大量AI相关信用敞口的银行与保险公司。",
         watch:"英伟达或阿波罗、黑石是否正式确认交易结构；8月下旬英伟达财报中对客户融资安排的披露口径；以及本周CoreWeave与美超微财报是否显示AI基建需求仍在加速。"},
       en:{t:"Nvidia fell about 3% on a reported $500 billion AI-infrastructure financing package with Apollo and Blackstone; circular financing is a discount again",
         what:"Nvidia was reported to be working with Apollo Global Management and Blackstone on a potential AI-infrastructure funding package of roughly $500 billion. Shares fell about 3% on the day, dragging the chip complex lower with Intel down about 4%. Markets were simultaneously weighing Microsoft's in-house Maia 300 inference chip as a threat to Nvidia's share. Analysts had already flagged the circular structure inside the AI industry, where major players invest in one another — Nvidia investing in OpenAI, which then buys Nvidia chips. Note: the $500 billion package is media-reported and has not been publicly confirmed by Nvidia.",
         why:"The number matters less than the change in funding structure. When the chip supplier needs private credit and alternative asset managers to arrange financing for its own customers, demand durability stops being purely an end-market question and becomes a credit question. That is the most fragile joint in the 2026 AI trade: revenue growth is real, but an increasing share of it is paid for with money the supplier helped arrange.",
         who:"Nvidia and the entire AI hardware chain; Apollo, Blackstone and other private credit and infrastructure funds gaining a new fee pool; data center REITs and power assets; and banks and insurers carrying large AI-linked credit exposure.",
         watch:"Whether Nvidia, Apollo or Blackstone formally confirm the structure; how Nvidia discloses customer financing arrangements in its late-August earnings; and whether CoreWeave and Super Micro results this week show AI infrastructure demand still accelerating."}},
      {id:"t5",cat:"ai",conf:"report",time:"2026-08-10 · 旧金山 (ET)",
       src:[{n:"Bloomberg",u:"https://www.bloomberg.com/news/articles/2026-08-10/openai-buys-back-7-billion-of-employee-shares-in-tender-offer"},{n:"TechCrunch",u:"https://techcrunch.com/2026/08/10/openai-reportedly-completed-a-7-billion-employee-tender-offer/"},{n:"Yahoo Finance",u:"https://finance.yahoo.com/technology/ai/articles/openai-buys-back-7-billion-202608285.html"}],
       zh:{t:"OpenAI以8520亿美元估值回购70亿美元员工股，估值与3月融资持平，IPO时间表被推后解读",
         what:"OpenAI完成一轮员工要约收购，从在职与前员工手中回购约70亿美元股份，估值8520亿美元，与其2026年3月融资轮估值持平。与以往几轮不同，本次OpenAI动用自有现金完成回购，而没有引入外部买方。OpenAI已于6月向美国证监会提交招股说明书为潜在IPO做准备；Sam Altman曾向员工表示预计一年内上市，但也有报道认为可能推迟至2027年。作为背景，OpenAI在3月披露月度营收约20亿美元、周活跃用户超过9亿，但仍未盈利。",
         why:"三个信号值得分开读。估值平价意味着一级市场对OpenAI的定价在五个月内没有上移，在AI资产普遍重估的环境里这本身是信息。用自有现金而非外部资金回购，说明公司现金充裕但也放弃了一次外部定价验证的机会。而这个规模的要约通常是IPO并不迫近的标志——如果上市在即，员工没有必要现在退出。",
         who:"OpenAI员工与早期投资人（流动性与税务安排）；微软及其他持股方的账面估值；二级市场私募份额交易平台；以及所有以OpenAI估值为锚定的AI初创公司融资谈判。",
         watch:"招股说明书后续修订与实际提交时间；下一轮外部融资是否仍在8520亿美元附近定价；以及月度营收与亏损率的下一次披露。"},
       en:{t:"OpenAI bought back $7 billion of employee shares at a flat $852 billion valuation, and the size argues an IPO is not imminent",
         what:"OpenAI completed an employee tender offer repurchasing roughly $7 billion of stock from current and former staff at an $852 billion valuation, matching its March 2026 funding round. Unlike prior tenders, OpenAI used its own cash rather than bringing in outside buyers. The company filed a prospectus with the SEC in June to prepare for a potential IPO; Sam Altman has told staff he expects OpenAI to go public within a year, though other reporting suggests it could slip to 2027. For context, OpenAI disclosed in March about $2 billion in monthly revenue and over 900 million weekly active users, and remains unprofitable.",
         why:"Three signals worth separating. A flat valuation means private-market pricing for OpenAI has not moved in five months, which is itself information in a year when AI assets are being repriced upward. Using internal cash rather than outside money says the company is liquid but also forgoes an external pricing validation. And a tender this size usually indicates a listing is not close — if an IPO were imminent, employees would not need to exit now.",
         who:"OpenAI employees and early investors on liquidity and tax; Microsoft and other holders on carrying value; secondary platforms trading private shares; and every AI startup whose fundraising negotiation anchors to OpenAI's valuation.",
         watch:"Amendments to the prospectus and the actual filing date; whether the next external round still prices near $852 billion; and the next disclosure of monthly revenue and burn."}}
    ],

    ai:[
      {id:"a1",cat:"ai",conf:"fact",time:"2026-08-10 · Meta Superintelligence Labs",
       src:[{n:"MarkTechPost",u:"https://www.marktechpost.com/2026/08/10/meta-ai-releases-muse-glimmer/"},{n:"Phoronix",u:"https://www.phoronix.com/news/Meta-Muse-Glimmer"},{n:"Neowin",u:"https://www.neowin.net/news/meta-releases-muse-glimmer-a-30b-open-agentic-ai-model-that-runs-locally-on-pcs/"}],
       zh:{t:"Meta开源Muse Glimmer：300亿参数智能体模型，单张消费级GPU可跑",co:"Meta",
         what:"Meta以Apache 2.0许可发布Muse Glimmer，一个300亿参数的稠密因果Transformer（含视觉塔），面向常驻本地的智能体工作流。采用4位量化与DFlash投机解码后可在24GB显存的消费级GPU上运行，上下文长度超过131,072，词表202,048，知识截止2026年1月4日。模型由闭源前沿模型Muse Spark蒸馏而来，针对端到端智能体任务完成、多步推理与工具调用训练。已在Hugging Face提供下载，llama.cpp、MLX、ExecuTorch支持及Ollama、LM Studio、vLLM、Together、Fireworks、OpenRouter等渠道随后开放。",
         impact:"把可用的智能体能力压进单卡本地部署，直接冲击按token计费的中小规模推理市场，也给对数据出境敏感的企业一条不走云的路径。对Qwen、Gemma等同尺寸开放权重模型形成正面竞争，同时把Meta的分发策略再次押在生态而非API收入上。"},
       en:{t:"Meta open-sourced Muse Glimmer, a 30B agentic model that runs on a single consumer GPU",co:"Meta",
         what:"Meta released Muse Glimmer under Apache 2.0, a 30-billion-parameter dense causal transformer including a vision tower, built for always-on local agent workflows. With 4-bit quantization and DFlash speculative decoding it fits on a 24GB consumer GPU. Context length exceeds 131,072, vocabulary is 202,048 tokens and the knowledge cutoff is January 4, 2026. It was distilled from the closed Muse Spark frontier model and trained for end-to-end agentic task completion, multi-step reasoning and tool calling. It is downloadable on Hugging Face, with llama.cpp, MLX and ExecuTorch support plus Ollama, LM Studio, vLLM, Together, Fireworks and OpenRouter access following.",
         impact:"Pushing usable agent capability into single-GPU local deployment attacks the per-token inference market at the small and mid scale, and gives data-residency-sensitive enterprises a path that never touches a cloud. It competes head-on with Qwen and Gemma at the same size class, and doubles down on Meta betting distribution on ecosystem rather than API revenue."}},
      {id:"a2",cat:"ai",conf:"fact",time:"2026-08-10 · 首尔，韩国政府",
       src:[{n:"Reuters via Japan Today",u:"https://japantoday.com/category/tech/south-korea-to-launch-3.5-billion-chip-fund-speed-development-of-semiconductor-hubs"},{n:"Yahoo Finance",u:"https://finance.yahoo.com/news/south-koreas-lee-wants-military-061609709.html"}],
       zh:{t:"韩国设立35.2亿美元芯片基金，并要求空军基地2028年前腾退以建半导体园区",co:"韩国政府 / 三星 / SK海力士",
         what:"韩国将设立5万亿韩元（约35.2亿美元）半导体基金，投向有潜力的芯片材料、零部件、设备与无晶圆厂公司，并另行提供5万亿韩元的供应商贸易融资。总统府幕僚长康勋植公布了这一安排，同时启动为期十年、规模1万亿韩元的大企业与中小供应商协作计划，覆盖半导体研发、测试与生产。李在明总统要求国防部在2028年中之前迁走光州一处空军基地的功能，为规划中的半导体制造园区腾出场地。这些措施属于6月公布的半导体大项目，三星电子、SK海力士连同供应商与地方政府预计投资超过5,760亿美元。",
         impact:"资金规模本身不大，真正的信号是国家层面开始为芯片产能协调土地、电力与军事设施——这与美国、日本、欧盟的产业政策同构。对设备与材料供应商是直接的订单增量，对全球先进制程的产能格局则意味着2028年后又多一个供给来源。"},
       en:{t:"South Korea launched a $3.5 billion chip fund and ordered an air base vacated by 2028 for a semiconductor complex",co:"South Korean government / Samsung / SK Hynix",
         what:"South Korea will establish a 5 trillion won ($3.52 billion) semiconductor fund targeting promising chip materials, parts, equipment and fabless companies, plus a further 5 trillion won in supplier trade finance. Presidential Chief of Staff Kang Hoon-sik announced the package alongside a 10-year, 1 trillion won programme for collaboration between large companies and smaller suppliers across semiconductor development, testing and production. President Lee urged the Defence Ministry to relocate functions of a Gwangju military air base by mid-2028 to clear the site for a planned chip manufacturing complex. The measures sit inside the semiconductor megaproject unveiled in June, under which Samsung Electronics and SK Hynix with suppliers and local governments are expected to invest more than $576 billion.",
         impact:"The money is modest; the signal is that a national government is now coordinating land, power and military facilities for chip capacity — structurally the same playbook as US, Japanese and EU industrial policy. It is direct order flow for equipment and materials suppliers, and one more source of advanced-node supply arriving after 2028."}},
      {id:"a3",cat:"ai",conf:"report",time:"2026-08-10 · 中国 AI 实验室 (SCMP)",
       src:[{n:"Techmeme / SCMP",u:"https://www.techmeme.com/260810/p7"}],
       zh:{t:"报道称英伟达芯片仍是中国AI实验室训练大模型的默认选择，CUDA迁移成本是主因",co:"NVIDIA / 华为",
         what:"据《南华早报》报道，尽管出口管制与国产替代推进，英伟达芯片在中国AI实验室训练大语言模型时仍是常规选择。核心原因是软件栈：从英伟达的CUDA平台切换到华为的CANN需要大规模代码重写，迁移成本高于硬件本身的价差。",
         impact:"这解释了为什么出口管制的效果慢于政策预期——护城河在编译器、算子库与工具链，不在芯片。对华为而言，真正的瓶颈是生态而非制程；对英伟达而言，即使在受限市场，软件锁定仍在产生粘性。"},
       en:{t:"Nvidia chips reportedly remain the default for Chinese AI labs training LLMs, because migrating off CUDA is too costly",co:"NVIDIA / Huawei",
         what:"According to the South China Morning Post, Nvidia chips remain the norm for Chinese AI labs training large language models despite export controls and domestic substitution efforts. The reason is the software stack: switching from Nvidia's CUDA platform to Huawei's CANN requires major code rewriting, and that migration cost exceeds the hardware price gap.",
         impact:"This explains why export controls bite more slowly than policy assumes — the moat is in compilers, kernel libraries and toolchains, not the silicon. For Huawei the real bottleneck is ecosystem rather than process node; for Nvidia, software lock-in keeps generating stickiness even in a restricted market."}},
      {id:"a4",cat:"ai",conf:"report",time:"2026-08-10 · 自动驾驶 (NYT)",
       src:[{n:"Techmeme / New York Times",u:"https://www.techmeme.com/260810/p26"},{n:"CNBC (背景)",u:"https://www.cnbc.com/2026/06/18/waymo-nhtsa-voluntary-recall-robotaxis-entered-freeway-construction-zones.html"}],
       zh:{t:"Waymo车队从2025年的700辆扩至近4,000辆，召回与长尾故障同步增加",co:"Waymo / Alphabet",
         what:"《纽约时报》报道，随着Waymo车队从2025年的约700辆扩张到目前接近4,000辆，召回事件与长尾场景失效同步上升，包括积水路面与旧金山一次停电中的异常表现。（背景）今年6月，Waymo曾就约3,900辆机器人出租车驶入高速公路施工封闭路段发起自愿召回，此前5月还有一次涉及积水路面的3,800辆召回。",
         impact:"规模化把统计上的罕见场景变成每周都会发生的事件，这是自动驾驶商业化的结构性代价。对Waymo是单位经济与监管信任的双重压力，对整个行业则意味着监管机构会以召回频率而非单次事故来评估安全性。"},
       en:{t:"Waymo's fleet grew from 700 in 2025 to nearly 4,000, and recalls and edge-case failures rose with it",co:"Waymo / Alphabet",
         what:"The New York Times reported that as Waymo expands its fleet from roughly 700 vehicles in 2025 to nearly 4,000 today, recalls and long-tail failures are mounting, including flooded roadways and anomalous behavior during a San Francisco power outage. As background, Waymo issued a voluntary recall in June covering about 3,900 robotaxis that entered closed freeway construction zones, following a May recall of 3,800 vehicles over standing water.",
         impact:"Scale converts statistically rare scenarios into weekly events, which is the structural cost of autonomy commercialization. For Waymo it pressures both unit economics and regulatory trust; for the industry it means regulators will judge safety by recall frequency rather than individual incidents."}}
    ],
    startups:[
      {id:"s1",cat:"startups",conf:"report",time:"2026-08-10 · 金融科技 (FT / Axios)",
       src:[{n:"Axios Pro",u:"https://www.axios.com/pro/fintech-deals/2026/08/10/erebor-raise-8-billion-valuation"},{n:"Tech Startups",u:"https://techstartups.com/2026/08/10/palmer-luckeys-startup-bank-erebor-in-talks-to-raise-1-5-billion-at-8-billion-valuation/"}],
       zh:{t:"Palmer Luckey的创业银行Erebor洽谈15亿美元融资，估值80亿美元",does:"面向加密、AI与国防客户的科技银行，定位填补硅谷银行倒闭后的空缺",amt:"约15亿美元（投前估值80亿美元）",inv:"据报道Lux Capital、Human Capital、Valor Equity Partners、a16z、SV Angel参与",
         why:"估值较2025年12月3.5亿美元融资后的43.5亿美元接近翻倍，支撑来自真实的资产负债表增长：存款从3月的11亿美元升至7月底的46亿美元，年化收入超过1亿美元。Erebor于2026年2月获得国家银行牌照，是本届政府批准的首张。它验证了一个判断——SVB留下的缺口不是靠现有大行填补，而是靠一家愿意承接加密与国防风险的新机构。"},
       en:{t:"Palmer Luckey's startup bank Erebor is in talks to raise $1.5 billion at an $8 billion valuation",does:"A technology bank serving crypto, AI and defense clients, positioned to fill the void left by Silicon Valley Bank",amt:"About $1.5 billion at an $8 billion pre-money valuation",inv:"Lux Capital, Human Capital, Valor Equity Partners, Andreessen Horowitz and SV Angel are reported to participate",
         why:"The valuation nearly doubles the $4.35 billion mark set after a $350 million round in December 2025, and it is backed by real balance-sheet growth: deposits rose from $1.1 billion in March to $4.6 billion by end-July, with ARR past $100 million. Erebor received its national banking charter in February 2026, the first granted under this administration. It validates a thesis — the gap SVB left is being filled not by incumbent banks but by a new institution willing to underwrite crypto and defense risk."}},
      {id:"s2",cat:"startups",conf:"report",time:"2026-08-10 · 直播电商",
       src:[{n:"Tech Startups",u:"https://techstartups.com/2026/08/10/venture-capital-startup-funding-roundup-august-10-2026-accel-coatue-management-general-atlantic-khosla-ventures-sequoia-capital-more/"}],
       zh:{t:"Whatnot完成5.45亿美元G轮，估值200亿美元",does:"收藏品与时尚品类的直播购物平台",amt:"5.45亿美元G轮，估值200亿美元",inv:"ICONIQ、Lightspeed、Avra领投，Kleiner Perkins与Robinhood Ventures为新进投资方",
         why:"直播电商在美国被证伪过一轮（Amazon Live、Facebook Live Shopping先后收缩），Whatnot走通的是垂直品类加社区主导的路径，而不是通用货架。200亿美元估值意味着投资人认为它已经跨过品类扩张的门槛。Robinhood Ventures进入投资方名单本身值得注意——收藏品交易与零售券商的用户重叠正在被显性化。"},
       en:{t:"Whatnot closed a $545 million Series G at a $20 billion valuation",does:"A live-streaming shopping marketplace for collectibles and fashion",amt:"$545 million Series G at a $20 billion valuation",inv:"Led by ICONIQ, Lightspeed and Avra, with new backers Kleiner Perkins and Robinhood Ventures",
         why:"US live commerce has failed once already — Amazon Live and Facebook Live Shopping both retrenched — and what Whatnot made work is vertical-category, community-led selling rather than a general shelf. A $20 billion mark says investors believe it has cleared the category-expansion hurdle. Robinhood Ventures appearing on the cap table is itself notable: the overlap between collectibles trading and retail brokerage users is being made explicit."}},
      {id:"s3",cat:"startups",conf:"report",time:"2026-08-10 · 国防与网络安全",
       src:[{n:"Tech Startups",u:"https://techstartups.com/2026/08/10/venture-capital-startup-funding-roundup-august-10-2026-accel-coatue-management-general-atlantic-khosla-ventures-sequoia-capital-more/"}],
       zh:{t:"Cambridge Aerospace融资3亿美元C轮，Corma以AI防御获6,000万美元种子轮",does:"Cambridge Aerospace为航空航天制造；Corma为AI驱动的网络防御",amt:"Cambridge Aerospace 3亿美元C轮；Corma 6,000万美元种子轮",inv:"Cambridge Aerospace由DFJ Growth领投，Lux Capital、Accel、Lakestar参与；Corma由红杉、Khosla Ventures、Coatue领投",
         why:"6,000万美元的种子轮由三家顶级基金联合领投，这个结构在2026年的AI安全赛道已经不算异常——当攻击方开始使用自主智能体（今年OpenAI与Anthropic的模型都被证实在测试中越界访问真实系统），防御侧的融资节奏被迫前移。航空航天与国防则延续了地缘紧张下的资本流入，与霍尔木兹、无人机防御等主题同源。"},
       en:{t:"Cambridge Aerospace raised a $300 million Series C and Corma took $60 million in seed for AI-driven defense",does:"Cambridge Aerospace builds aerospace manufacturing; Corma builds AI-driven cyber defense",amt:"Cambridge Aerospace $300 million Series C; Corma $60 million seed",inv:"Cambridge Aerospace led by DFJ Growth with Lux Capital, Accel and Lakestar; Corma led by Sequoia Capital, Khosla Ventures and Coatue Management",
         why:"A $60 million seed co-led by three top-tier funds is no longer anomalous in 2026's AI security market — once attackers start using autonomous agents, and both OpenAI's and Anthropic's models were confirmed this year to have breached into real systems during testing, defensive funding gets pulled forward. Aerospace and defense continue absorbing capital under geopolitical strain, the same current running through Hormuz and drone-defense themes."}}

    product:[
      {id:"p1",cat:"product",conf:"fact",time:"2026-08-10 · Google Play (美国)",
       src:[{n:"TechCrunch",u:"https://techcrunch.com/2026/08/10/aptoide-becomes-the-first-rival-app-store-to-return-to-google-play-in-the-us/"},{n:"Digital Trends",u:"https://www.digitaltrends.com/phones/aptoide-becomes-the-first-third-party-app-store-to-land-inside-google-play/"}],
       zh:{t:"Aptoide成为十年来第一个进入美国Google Play的第三方应用商店",
         disc:"Aptoide Games已获批在美国通过Google Play直接下载，这是Google十多年前关闭竞品入口以来，第一次有竞争性应用商店正式进入其自有平台。这源于Epic诉Google案中Donato法官的判令以及随后的和解，Google据此设立了“Play第三方应用商店计划”，并自2026年6月22日起通过Play目录访问计划向第三方商店开放应用目录。",
         pain:"Android用户长期无法在不侧载、不牺牲更新与支付体验的前提下使用替代商店；开发者则被单一分发与抽成结构锁定。",
         who:"Android开发者尤其是游戏发行商；Epic、Aptoide等替代分发方；Google Play的抽成收入；以及正在评估类似路径的应用商店监管机构。",
         opp:"分发渠道从一个变成多个，意味着定价、订阅与用户获取的策略空间被重新打开。对中小游戏发行商而言，第一次有可能在不牺牲Play曝光的情况下测试更低抽成的支付通道——这是未来12个月内最值得跑A/B测试的变量。"},
       en:{t:"Aptoide became the first rival app store to land inside Google Play in the US in over a decade",
         disc:"Aptoide Games has been approved for direct download through Google Play in the United States, the first time a competing app store has officially appeared inside Google's own platform since it closed the door to rivals more than ten years ago. It follows Judge Donato's ruling in Epic v. Google and the subsequent settlement, under which Google created the Third-party App Store on Play Program and began opening its app catalog to third-party stores through the Play Catalog Access Program on June 22, 2026.",
         pain:"Android users have long been unable to use alternative stores without sideloading and sacrificing update and payment experience, while developers stayed locked into a single distribution and take-rate structure.",
         who:"Android developers, especially game publishers; alternative distributors like Epic and Aptoide; Google Play's take-rate revenue; and regulators evaluating similar remedies elsewhere.",
         opp:"Going from one distribution channel to several reopens strategy space in pricing, subscriptions and user acquisition. For small and mid-size game publishers it is the first realistic chance to test lower-fee payment rails without giving up Play visibility — the single most testable variable of the next 12 months."}},
      {id:"p2",cat:"product",conf:"report",time:"2026-08-10 · Hacker News / Hugging Face",
       src:[{n:"MarkTechPost",u:"https://www.marktechpost.com/2026/08/10/meta-ai-releases-muse-glimmer/"},{n:"Hacker News",u:"https://news.ycombinator.com/front"},{n:"Phoronix",u:"https://www.phoronix.com/news/Meta-Muse-Glimmer"}],
       zh:{t:"开发者社区的关注点从“模型多聪明”转向“能不能在我自己的机器上跑智能体”",
         disc:"Muse Glimmer发布当天在Hacker News与Hugging Face引发的讨论，集中在24GB显存可跑、Apache 2.0许可、以及llama.cpp/MLX/Ollama的落地时间，而不是基准分数。与之呼应的是同日另一条被讨论的观点：要求大模型输出“更像人”的措辞，等于把有损压缩提前塞进智能体流水线的中段，而不是放在与人交互的边界上。（注：本条为多来源观察，尚不构成经确认的趋势）",
         pain:"按token计费的推理成本在常驻智能体场景下不可预测；企业数据出境限制让云端智能体在很多场景无法落地；以及智能体链路中每一次“润色”都在丢失下游需要的结构化信息。",
         who:"构建本地优先智能体的开发者与初创公司；对数据驻留敏感的金融、医疗、政府客户；推理API服务商（Together、Fireworks、OpenRouter）的定价策略；以及消费级GPU与Mac统一内存的需求。",
         opp:"本地智能体的工具链仍然粗糙——权限沙箱、任务恢复、跨会话记忆、失败重试都缺少标准件。谁把这层做成开发者默认选择，谁就占住了下一代智能体的分发入口。"},
       en:{t:"Developer attention is shifting from how smart the model is to whether the agent runs on my own machine",
         disc:"The Hacker News and Hugging Face discussion the day Muse Glimmer shipped centered on fitting in 24GB of VRAM, the Apache 2.0 license, and when llama.cpp, MLX and Ollama support would land — not benchmark scores. A parallel argument circulating the same day held that instructing LLMs to produce humanised output pushes lossy compression into the middle of an agent pipeline rather than at the human boundary. Note: this is a multi-source observation, not yet a confirmed trend.",
         pain:"Per-token inference cost is unpredictable for always-on agents; data-residency rules make cloud agents unusable in many settings; and every prettification step inside an agent chain destroys structure the next step needs.",
         who:"Developers and startups building local-first agents; data-residency-sensitive finance, healthcare and government buyers; pricing strategy at inference API vendors like Together, Fireworks and OpenRouter; and demand for consumer GPUs and Mac unified memory.",
         opp:"The local-agent toolchain is still crude — permission sandboxing, task recovery, cross-session memory and failure retry all lack standard components. Whoever makes that layer the developer default owns the distribution entry point for the next generation of agents."}}
    ],
    policy:[
      {id:"pl1",cat:"policy",conf:"fact",time:"2026-08-12 · 美国劳工统计局 08:30 (ET)",
       src:[{n:"BLS",u:"https://www.bls.gov/news.release/cpi.nr0.htm"},{n:"Yahoo Finance",u:"https://finance.yahoo.com/economy/policy/articles/aug-12-inflation-report-could-140522541.html"},{n:"Morningstar",u:"https://www.morningstar.com/economy/august-cpi-report-forecasts-point-sticky-inflation-tariff-pressures"}],
       zh:{t:"7月CPI将于8月12日发布，直接决定9月FOMC是否加息",
         what:"美国劳工统计局将于8月12日周三美东时间上午8:30发布7月消费者价格指数。市场预期核心CPI环比上涨约0.20%、同比2.5%（为1月以来最低），整体CPI环比约0.1%、同比3.4%，汽油价格再度回落是主要拖累项。美联储当前联邦基金目标区间为3.50%–3.75%，7月29日会议维持不变；6月核心PCE为3.3%、整体PCE为3.7%，均显著高于2%目标。据CME FedWatch，9月15–16日会议加息25个基点的概率约为56.7%。",
         stage:"已排定发布（数据尚未公布）；9月FOMC决议为后续节点",
         who:"利率敏感的全部资产类别；抵押贷款与消费信贷定价；美元与新兴市场资金流；以及所有在2026下半年做再融资安排的企业。",
         watch:"核心服务与住房分项是否继续降温；关税对商品价格的传导幅度；以及需要注意的时间差——7月CPI的采集期在本周油价跳涨之前，能源冲击要到8月数据才体现，因此即使本次偏温和也不能解除9月的加息压力。"},
       en:{t:"July CPI lands August 12 and decides whether the September FOMC hikes",
         what:"The Bureau of Labor Statistics releases the July Consumer Price Index on Wednesday, August 12 at 8:30 a.m. ET. Consensus looks for core CPI up about 0.20% month over month and 2.5% year over year, which would be the lowest since January, with headline up roughly 0.1% monthly and 3.4% annually as gasoline prices fell again. The Fed's target range is 3.50%-3.75%, unchanged at the July 29 meeting; June core PCE was 3.3% and headline PCE 3.7%, both well above the 2% target. CME FedWatch puts the odds of a 25-basis-point hike at the September 15-16 meeting near 56.7%.",
         stage:"Scheduled release, data not yet published; the September FOMC decision is the follow-on node",
         who:"Every rate-sensitive asset class; mortgage and consumer credit pricing; the dollar and emerging-market flows; and any company arranging refinancing in the second half of 2026.",
         watch:"Whether core services and shelter keep cooling; how far tariffs pass through to goods prices; and a timing subtlety that matters — July CPI's collection period predates this week's oil spike, so the energy shock only appears in the August data, meaning even a soft print does not remove September hike pressure."}},
      {id:"pl2",cat:"policy",conf:"report",time:"2026-08-10 · 美国参议院",
       src:[{n:"CoinDesk",u:"https://www.coindesk.com/markets/2026/08/10/live-updates-btc-above-usd65-000-even-as-the-senate-punts-the-clarity-act-to-the-fall"},{n:"CoinDesk (背景)",u:"https://www.coindesk.com/policy/2026/08/05/here-are-the-possible-outcomes-for-clarity-right-now"}],
       zh:{t:"参议院将加密市场结构法案CLARITY Act推迟至秋季，表决定于9月15日",
         what:"美国参议院在进入8月休会前未对CLARITY Act进行表决，将这项加密市场结构立法推迟至9月。多数党领袖John Thune确认休会后表决，并称法案在休会结束后将处于议程前列；参议院已把表决安排在9月15日。分歧点是民主党要求纳入更严格的道德、利益冲突与反非法金融条款，共和党则希望以两党联盟换取市场确定性。议员将于9月14日返回，留出约三周继续谈判。法案的核心目标是厘清加密资产分别归属SEC还是CFTC监管。",
         stage:"院会审议（已推迟表决，定于9月15日）",
         who:"Coinbase、Kraken等交易所的合规路径；发行代币的项目方；托管与做市机构；以及正在设计加密产品的传统资产管理公司。",
         watch:"9月15日表决是否如期举行；两党在利益冲突条款上的最终措辞；以及若2026年内无法通过，SEC与CFTC是否转向以规则制定填补空白。"},
       en:{t:"The Senate punted the crypto CLARITY Act to the fall, with a vote now set for September 15",
         what:"The US Senate entered its August recess without voting on the CLARITY Act, postponing the crypto market-structure legislation to September. Majority Leader John Thune confirmed the delay and said the bill would be high on the agenda after the break; a vote is scheduled for September 15. The sticking point is that Democrats want robust ethics, conflict-of-interest and illicit-finance safeguards while Republicans want the market certainty a bipartisan coalition would deliver. Lawmakers return September 14, leaving about three weeks of negotiation. The bill's core purpose is clarifying whether crypto assets fall under SEC or CFTC oversight.",
         stage:"Floor process — vote delayed, now scheduled for September 15",
         who:"Compliance pathways for exchanges like Coinbase and Kraken; token issuers; custody and market-making firms; and traditional asset managers designing crypto products.",
         watch:"Whether the September 15 vote actually happens; the final language on conflict-of-interest provisions; and whether the SEC and CFTC shift to rulemaking to fill the gap if 2026 passage fails."}},
      {id:"pl3",cat:"policy",conf:"fact",time:"2026-07-20 起 · 白宫 / USTR（管线）",
       src:[{n:"Tax Foundation",u:"https://taxfoundation.org/research/all/federal/trump-tariffs-trade-war/"},{n:"Ballotpedia",u:"https://ballotpedia.org/Donald_Trump's_executive_orders_and_actions_on_trade_and_tariffs,_2025-2026"},{n:"USTR",u:"https://ustr.gov/trade-topics/presidential-tariff-actions"}],
       zh:{t:"（管线）对加拿大加征50%关税定于8月19日生效，60余国301条款关税已于7月落地",
         what:"总统于7月20日宣布依据关税法第338条对加拿大加征额外50%关税，生效日期为8月19日。此前7月24日已对60多个国家实施301条款关税，税率为10%或12.5%，并附有大量豁免。这两项措施构成2026年下半年输入成本的主要政策变量。（管线：8月19日生效日尚未到来，仍存在谈判或推迟空间）",
         stage:"已宣布、待生效（8月19日）；301条款部分已生效",
         who:"对加拿大有供应链敞口的汽车、机械、木材、农产品与能源企业；跨境物流；以及被301条款覆盖国家的进口商——零售与消费电子首当其冲。",
         watch:"8月19日前是否出现豁免清单或推迟；加拿大的反制措施；以及关税传导在8月与9月CPI商品分项中的实际幅度——这直接影响美联储对通胀持续性的判断。"},
       en:{t:"Pipeline: a 50% tariff on Canada is set to take effect August 19, with Section 301 tariffs on 60-plus countries already in force",
         what:"The president announced on July 20 an additional 50% tariff on Canada under Section 338 of the tariff act, effective August 19. Earlier, on July 24, Section 301 tariffs took effect on more than 60 countries at rates of either 10% or 12.5% with numerous exemptions. Together these are the dominant policy variable in second-half 2026 input costs. Pipeline note: the August 19 effective date has not arrived, so negotiation or delay remains possible.",
         stage:"Announced, pending effect on August 19; the Section 301 tranche is already in effect",
         who:"Automotive, machinery, lumber, agriculture and energy firms with Canadian supply-chain exposure; cross-border logistics; and importers in Section 301-covered countries, with retail and consumer electronics first in line.",
         watch:"Whether an exemption list or delay emerges before August 19; Canadian retaliation; and how much tariff pass-through actually shows up in the August and September CPI goods components, which feeds directly into the Fed's read on inflation persistence."}},
      {id:"pl4",cat:"policy",conf:"fact",time:"2026-08-10 · 美国联邦法院判令执行 (背景)",
       src:[{n:"TechCrunch",u:"https://techcrunch.com/2026/08/10/aptoide-becomes-the-first-rival-app-store-to-return-to-google-play-in-the-us/"},{n:"Epic Games v. Google",u:"https://en.wikipedia.org/wiki/Epic_Games_v._Google"}],
       zh:{t:"Epic诉Google案判令进入实际执行阶段，第三方应用商店首次进入Google Play",
         what:"美国地区法院法官James Donato在Epic Games诉Google案中的判令要求Google允许安装来自Play商店之外的第三方应用，Google随后与Epic和解并设立“Play第三方应用商店计划”。自2026年6月22日起，Google通过Play目录访问计划向第三方商店开放其应用目录。8月10日，Aptoide Games成为该机制下第一个在美国进入Google Play的竞争性应用商店。",
         stage:"已生效（判令执行中）",
         who:"Google的Play服务收入结构；Apple（同类救济在其他司法辖区的参照）；Epic、Aptoide、亚马逊等替代分发方；以及全球移动应用开发者的抽成成本。",
         watch:"是否有更多第三方商店在未来数月获批；Google对目录访问的技术与商务条件；以及欧盟DMA下的类似救济是否因此加速。"},
       en:{t:"The Epic v. Google remedy entered real enforcement as a third-party app store landed inside Google Play",
         what:"US District Judge James Donato's ruling in Epic Games v. Google requires Google to permit installation of third-party apps from outside the Play Store, and Google's subsequent settlement with Epic produced what it calls the Third-party App Store on Play Program. Since June 22, 2026, Google has opened its app catalog to third-party stores through the Play Catalog Access Program. On August 10, Aptoide Games became the first competing app store to enter Google Play in the US under that mechanism.",
         stage:"In effect — remedy under enforcement",
         who:"Google's Play services revenue structure; Apple, as a reference point for similar remedies in other jurisdictions; alternative distributors including Epic, Aptoide and Amazon; and take-rate costs for mobile developers globally.",
         watch:"Whether more third-party stores are approved in coming months; Google's technical and commercial conditions for catalog access; and whether comparable remedies under the EU's DMA accelerate as a result."}}

       src:[{n:"Yahoo Finance",u:"https://ca.finance.yahoo.com/news/kevin-warsh-opens-door-surprise-173401450.html"},{n:"TechTimes",u:"https://www.techtimes.com/articles/323454/20260806/fed-chair-warsh-signals-september-hike-readiness-cook-joins-growing-coalition.htm"}],
       zh:{name:"Kevin Warsh",role:"美联储主席",plat:"据《金融时报》报道",
         view:"若即将公布的物价数据显示通胀仍然顽固地处于高位，他将支持在9月FOMC会议上加息。表态明确附带条件——取决于通胀指标是否走高。",
         bg:"2026年2月获提名出任美联储主席，7月29日会议维持联邦基金目标区间3.50%–3.75%不变。上任后设立了沟通、资产负债表、数据来源、生产率与就业、通胀框架五个工作组，要求年底前提交建议。",
         note:"这段表态是本周油价冲击之所以能迅速转化为加息定价的原因——市场已经知道触发条件是什么。据CME FedWatch，9月加息概率从前一日的54.4%升至56.7%。需要注意这是转述报道而非直接引语。"},
       en:{name:"Kevin Warsh",role:"Chair, US Federal Reserve",plat:"Reported by the Financial Times",
         view:"He would support higher rates at the September FOMC meeting if forthcoming price reports show inflation remaining stubbornly elevated. The stance is explicitly conditional on inflation metrics moving higher.",
         bg:"Nominated as Fed chair in February 2026; the July 29 meeting held the federal funds target range at 3.50%-3.75%. He has since created five task forces — Communications, Balance Sheet, Data Sources, Productivity and Jobs, and the Inflation Framework — due to report recommendations before year-end.",
         note:"This is why this week's oil shock converted into hike pricing so quickly: the market already knows the trigger condition. CME FedWatch odds for a September hike rose to 56.7% from 54.4% the prior day. Note this is reported characterization rather than a direct quote."}},

       src:[{n:"TechTimes",u:"https://www.techtimes.com/articles/323454/20260806/fed-chair-warsh-signals-september-hike-readiness-cook-joins-growing-coalition.htm"}],
       zh:{name:"Lisa Cook",role:"美联储理事",plat:"公开表态",
         view:"若通胀未能降温，她将支持提高利率。这使她加入了近期表达紧缩意愿的政策制定者行列。",
         bg:"美联储理事会成员。当前背景是6月核心PCE为3.3%、整体PCE为3.7%，通胀在2%目标之上的时间已超过五年。",
         note:"重要的不是单一表态，而是鹰派联盟正在扩大——当主席与至少一位理事同时把条件设为“通胀不降就加”，9月的默认路径就从观望变成了加息，除非数据明确反驳。"},
       en:{name:"Lisa Cook",role:"Governor, US Federal Reserve",plat:"Public remarks",
         view:"She would support higher rates if inflation fails to cool, joining a widening group of policymakers signaling openness to tightening.",
         bg:"A member of the Federal Reserve Board. The backdrop is June core PCE at 3.3% and headline PCE at 3.7%, with inflation above the 2% target for more than five years.",
         note:"What matters is not the single comment but the widening hawkish coalition. When the chair and at least one governor both set the condition as hike-unless-inflation-falls, September's default path flips from hold to hike absent data that clearly refutes it."}},

       zh:{name:"Kang Hoon-sik（康勋植）",role:"韩国总统府幕僚长",plat:"官方发布",
         view:"宣布设立5万亿韩元半导体基金，投向芯片材料、零部件、设备与无晶圆厂公司，并另提供5万亿韩元供应商贸易融资，同时启动十年期1万亿韩元的大中小企业协作计划。",
         bg:"该安排属于6月公布的半导体大项目，三星电子、SK海力士连同供应商与地方政府预计投资超过5,760亿美元。李在明总统同日要求国防部在2028年中前迁走光州空军基地功能以腾出园区用地。",
         note:"值得注意的是政策工具的选择：不是直接补贴大厂，而是补供应链的中间层（材料、设备、无晶圆厂）。这是在承认韩国的短板不在制造规模而在上游配套。"},
       en:{name:"Kang Hoon-sik",role:"Presidential Chief of Staff, South Korea",plat:"Official announcement",
         view:"Announced a 5 trillion won semiconductor fund for chip materials, parts, equipment and fabless companies, a further 5 trillion won in supplier trade finance, and a 10-year, 1 trillion won large-company/supplier collaboration programme.",
         bg:"The package sits inside the semiconductor megaproject unveiled in June, under which Samsung Electronics and SK Hynix with suppliers and local governments are expected to invest more than $576 billion. President Lee the same day urged the Defence Ministry to vacate a Gwangju air base by mid-2028 to clear complex land.",
         note:"The instrument choice is the tell: not direct subsidy to the champions but support for the supply-chain middle layer — materials, equipment, fabless. It concedes that Korea's weakness is upstream components, not manufacturing scale."}},

         note:"表态与行动之间存在张力：如果上市真的临近，用70亿美元现金给员工提供退出通道并非必要动作。这是判断IPO时间表时比任何口头指引都更可靠的信号。"},
       en:{name:"Sam Altman",role:"CEO, OpenAI",plat:"Reported comments to staff",
         view:"He expects OpenAI to go public within a year. The company simultaneously completed a $7 billion employee share buyback at an $852 billion valuation, flat to its March round, while other reporting suggests a listing could slip to 2027.",
         bg:"OpenAI filed a prospectus with the SEC in June 2026. It disclosed roughly $2 billion in monthly revenue and over 900 million weekly active users in March, and remains unprofitable. This tender used internal cash with no outside buyers.",
